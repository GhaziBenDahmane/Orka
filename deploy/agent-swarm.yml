services:
  agent:
    image: ${DOCKYARD_IMAGE:?set DOCKYARD_IMAGE to an immutable digest}
    command: ["agent"]
    environment:
      DOCKYARD_CONTROL_PLANE_URL: ${DOCKYARD_CONTROL_PLANE_URL}
      DOCKYARD_AGENT_URL: ${DOCKYARD_AGENT_URL}
      DOCKYARD_AGENT_ENROLLMENT_TOKEN_FILE: /run/secrets/dockyard_agent_enrollment_token
      DOCKYARD_AGENT_STATE_DIRECTORY: /var/lib/dockyard-agent
      DOCKYARD_AGENT_SERVICE_NAME: ${DOCKYARD_AGENT_SERVICE_NAME:-dockyard-agent_agent}
      DOCKYARD_TRAEFIK_NETWORK: ${DOCKYARD_TRAEFIK_NETWORK:-dockyard-public}
    secrets: [dockyard_agent_enrollment_token]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agent-state:/var/lib/dockyard-agent
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: ${DOCKYARD_AGENT_CPU_LIMIT:-4.0}
          memory: ${DOCKYARD_AGENT_MEMORY_LIMIT:-4G}
        reservations:
          cpus: ${DOCKYARD_AGENT_CPU_RESERVATION:-0.25}
          memory: ${DOCKYARD_AGENT_MEMORY_RESERVATION:-256M}
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 30s

volumes:
  agent-state: {}

secrets:
  dockyard_agent_enrollment_token: {external: true}
