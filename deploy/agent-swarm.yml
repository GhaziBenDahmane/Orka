services:
  agent:
    image: ${DOCKYARD_IMAGE:?set DOCKYARD_IMAGE to an immutable digest}
    command: ["agent"]
    stop_grace_period: 30s
    environment:
      DOCKYARD_CONTROL_PLANE_URL: ${DOCKYARD_CONTROL_PLANE_URL}
      DOCKYARD_AGENT_URL: ${DOCKYARD_AGENT_URL}
      DOCKYARD_AGENT_ENROLLMENT_TOKEN_FILE: /run/secrets/dockyard_agent_enrollment_token
      DOCKYARD_AGENT_STATE_DIRECTORY: /var/lib/dockyard-agent
      DOCKYARD_AGENT_SERVICE_NAME: ${DOCKYARD_AGENT_SERVICE_NAME:-dockyard-agent_agent}
      DOCKYARD_TRAEFIK_NETWORK: ${DOCKYARD_TRAEFIK_NETWORK:-dockyard-public}
      DOCKYARD_EGRESS_PRIVATE_CIDRS: ${DOCKYARD_EGRESS_PRIVATE_CIDRS:-}
      HOME: /tmp/dockyard-home
      XDG_CACHE_HOME: /tmp/dockyard-cache
    secrets:
      - source: dockyard_agent_enrollment_token
        target: dockyard_agent_enrollment_token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - agent-state:/var/lib/dockyard-agent
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1073741824,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
      options:
        max-size: ${DOCKYARD_CONTAINER_LOG_MAX_SIZE:-20m}
        max-file: ${DOCKYARD_CONTAINER_LOG_MAX_FILES:-5}
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: ${DOCKYARD_AGENT_CPU_LIMIT:-4.0}
          memory: ${DOCKYARD_AGENT_MEMORY_LIMIT:-4G}
        reservations:
          cpus: ${DOCKYARD_AGENT_CPU_RESERVATION:-0.25}
          memory: ${DOCKYARD_AGENT_MEMORY_RESERVATION:-256M}
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 30s

volumes:
  agent-state: {}

secrets:
  dockyard_agent_enrollment_token:
    external: true
    name: ${DOCKYARD_AGENT_ENROLLMENT_TOKEN_SECRET:-dockyard_agent_enrollment_token}
