groups:
  - name: dockyard-control-plane
    rules:
      - alert: DockyardControllerDown
        expr: up{job="dockyard"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Dockyard controller is unavailable
          description: Prometheus has been unable to scrape Dockyard for two minutes.

      - alert: DockyardControllerReplicaShortfall
        expr: count(dockyard_controller_build_info) < max(dockyard_controller_expected_replicas) or absent(dockyard_controller_build_info)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Fewer Dockyard controller replicas are being scraped than configured
          description: Prometheus cannot see the configured number of controller tasks. Check Swarm task health and tasks.<stack>_dockyard DNS discovery before trusting fleet-wide consistency alerts.

      - alert: DockyardControllerBuildFleetMismatch
        expr: count(count by (version, revision) (dockyard_controller_build_info)) > 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Dockyard controllers are running different builds
          description: Scraped controller replicas report different immutable version or source-revision identities; finish or roll back the controller update before control-plane maintenance.

      - alert: DockyardStaleJobLease
        expr: dockyard_job_stale_leases > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: A Dockyard worker lease is stale
          description: At least one running job has stopped heartbeating and may require recovery.

      - alert: DockyardQueueBacklog
        expr: max(dockyard_job_oldest_age_seconds{status="pending"}) > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Dockyard jobs are waiting too long
          description: The oldest pending job has been queued for more than five minutes.

      - alert: DockyardOperationFailures
        expr: sum(increase(dockyard_operations_total{status="failed"}[10m])) by (kind) > 0
        labels:
          severity: warning
        annotations:
          summary: Dockyard background operation failed
          description: One or more {{ $labels.kind }} operations failed in the last ten minutes.

      - alert: DockyardBuildWorkspaceLimitRejected
        expr: increase(dockyard_build_workspace_limit_rejections_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: A build source exceeded the workspace safety limit
          description: A Git checkout or uploaded ZIP expanded beyond DOCKYARD_MAX_BUILD_WORKSPACE_BYTES. Review the rejected deployment before changing the limit.

      - alert: DockyardTemplateRepositorySyncQueued
        expr: dockyard_template_repository_sync_pending_age_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A template repository refresh is not being claimed
          description: Repository {{ $labels.repository }} in organization {{ $labels.organization }} has waited more than five minutes for the catalog scheduler.

      - alert: DockyardTemplateRepositorySyncStuck
        expr: dockyard_template_repository_sync_running_age_seconds > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A template repository refresh is stuck
          description: Repository {{ $labels.repository }} in organization {{ $labels.organization }} has remained in the running state for more than ten minutes.

      - alert: DockyardTemplateRepositorySyncFailed
        expr: dockyard_template_repository_sync_failed == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A template repository refresh failed
          description: Inspect the repository ref, credential, signature policy, and bounded sync error before retrying repository {{ $labels.repository }}.

      - alert: DockyardDatabaseDriverFleetMismatch
        expr: count(count by (digest) (dockyard_database_driver_inventory_info)) > 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Dockyard controllers loaded different database drivers
          description: Scraped controller replicas report different database-driver inventories; stop database recovery and migration work until every replica runs the reviewed artifacts.

      - alert: DockyardDatabaseDriverBindingIssue
        expr: dockyard_database_driver_binding_issues > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: A managed database driver identity cannot be honored
          description: Controller database bindings for {{ $labels.engine }} have issue {{ $labels.reason }}; install the expected artifact on every controller or perform an audited driver rebind.

      - alert: DockyardDatabaseUtilityProvenanceMissing
        expr: max without (instance) (dockyard_database_utility_provenance_issues) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Database recovery evidence uses an unverified utility image
          description: Successful {{ $labels.operation }} evidence is missing a digest-pinned image for role {{ $labels.role }}; complete a fresh verified operation before relying on that recovery evidence.

      - alert: DockyardAIAuditFailed
        expr: dockyard_ai_audit_last_failure_age_seconds < 900
        labels:
          severity: warning
        annotations:
          summary: A Dockyard AI audit failed
          description: The AI auditor for organization {{ $labels.organization }} reported a failed run in the last fifteen minutes.

      - alert: DockyardAIAuditOverdue
        expr: dockyard_ai_audit_completion_overdue == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A Dockyard AI audit is overdue
          description: Organization {{ $labels.organization }} has an active auditor token but no completed audit within the expected 48-hour window.

      - alert: DockyardAIAuditStuck
        expr: dockyard_ai_audit_running_age_seconds > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A Dockyard AI audit is stuck
          description: An AI audit for organization {{ $labels.organization }} has remained running for more than ten minutes.

      - alert: DockyardNotificationDeliveryFailures
        expr: increase(dockyard_operations_total{kind="notify.webhook",status="failed"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: A Dockyard notification delivery attempt failed
          description: A notification endpoint rejected a delivery or was unavailable; the durable queue will retry it.

      - alert: DockyardBackupStale
        expr: max without (instance) (dockyard_database_backup_last_success_age_seconds{scope="all"}) > 86400
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: No successful Dockyard database backup in 24 hours
          description: Review backup policies, queue health, and remote storage availability.

      - alert: DockyardDatabaseBackupOverdue
        expr: max without (instance) (dockyard_database_backup_overdue) == 1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: A database backup is overdue
          description: Database {{ $labels.database }} has no successful encrypted backup within twice its configured interval.

      - alert: DockyardDatabaseBackupPolicyUnavailable
        expr: max without (instance) (dockyard_database_backup_policy_status{state=~"missing|disabled"}) == 1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: A managed database has no active backup policy
          description: Database {{ $labels.database }} has backup-policy state {{ $labels.state }}; configure and enable a retained remote backup policy.

      - alert: DockyardDatabaseRestoreVerificationDisabled
        expr: max without (instance) (dockyard_database_restore_verification_enabled) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Automatic database restore verification is disabled
          description: Database {{ $labels.database }} has scheduled backups but does not exercise them through isolated restore drills.

      - alert: DockyardBackupArtifactDeletionStalled
        expr: max without (instance) (dockyard_backup_artifact_deletion_oldest_age_seconds) > 900
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Remote backup artifact cleanup is stalled
          description: A {{ $labels.kind }} backup object has remained in the durable deletion queue for more than fifteen minutes; review object-store access and destination credentials.

      - alert: DockyardVolumeBackupOverdue
        expr: max without (instance) (dockyard_volume_backup_overdue) == 1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: A named-volume backup is overdue
          description: Service {{ $labels.service }} volume {{ $labels.volume }} has no successful encrypted backup within twice its configured interval.

      - alert: DockyardVolumeBackupPolicyUnavailable
        expr: max without (instance) (dockyard_volume_backup_policy_status{state=~"missing|disabled"}) == 1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: A mounted named volume has no active backup policy
          description: Service {{ $labels.service }} volume {{ $labels.volume }} has backup-policy state {{ $labels.state }}; configure and enable an encrypted retained backup policy.

      - alert: DockyardVolumeBackupPolicyInventoryInvalid
        expr: max without (instance) (dockyard_volume_backup_policy_inventory_valid) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Named-volume backup coverage cannot be evaluated
          description: Service {{ $labels.service }} has an invalid Compose volume definition; fix it before relying on backup-policy coverage alerts.

      - alert: DockyardVolumeBackupStorageNodeMissing
        expr: max without (instance) (dockyard_volume_backup_storage_node_bound) == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: A protected named volume has no storage-node binding
          description: Service {{ $labels.service }} volume {{ $labels.volume }} cannot be scheduled for backup until the workload is deployed and pinned to its Swarm storage node.

      - alert: DockyardVolumeBackupQuiescenceDisabled
        expr: max without (instance) (dockyard_volume_backup_quiescence_enabled) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A named-volume backup does not pause workload writers
          description: Service {{ $labels.service }} volume {{ $labels.volume }} permits writes during archive creation; enable quiescence or validate and document crash-consistent recovery.

      - alert: DockyardVolumeRestoreRehearsalOverdue
        expr: max without (instance) (dockyard_volume_restore_rehearsal_overdue) == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A named-volume restore rehearsal is overdue
          description: Service {{ $labels.service }} volume {{ $labels.volume }} has no successful restore rehearsal within twice its configured interval (minimum 24 hours).

      - alert: DockyardOfflineVolumeRestoreFailed
        expr: max without (instance) (dockyard_volume_restore_last_failure_age_seconds{mode="offline"}) < 900
        labels:
          severity: critical
        annotations:
          summary: An offline named-volume recovery failed
          description: Service {{ $labels.service }} volume {{ $labels.volume }} failed offline recovery; keep the workload stopped, inspect its restore record and storage-node assignment, and retry recovery before starting it.

      - alert: DockyardOfflineVolumeRestoreStalled
        expr: max without (instance) (dockyard_volume_restore_active_age_seconds{mode="offline"}) > 1800
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: An offline named-volume recovery is stalled
          description: Service {{ $labels.service }} volume {{ $labels.volume }} has remained in {{ $labels.status }} for more than thirty minutes; keep the workload stopped while checking its worker, target node, and object store.

      - alert: DockyardRestoreDrillOverdue
        expr: max without (instance) (dockyard_restore_drill_overdue) == 1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: A scheduled database restore drill is overdue
          description: Database {{ $labels.database }} has no successful restore drill within twice its configured backup interval (minimum 24 hours).

      - alert: DockyardDatabaseMigrationStalled
        expr: max without (instance) (dockyard_database_migration_active_age_seconds) > 7200
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: A Dokploy database transfer is stalled
          description: Database {{ $labels.database }} has had a queued or running native migration for more than two hours.

      - alert: DockyardDatabaseMigrationFailed
        expr: max without (instance) (dockyard_database_migration_last_failure_age_seconds{scope="all"}) < 900
        labels:
          severity: critical
        annotations:
          summary: A Dokploy database transfer failed
          description: A destructive native database migration exhausted its retries in the last fifteen minutes.

      - alert: DockyardMaintenanceModeLeftEnabled
        expr: sum(dockyard_maintenance_scopes) > 0
        for: 4h
        labels:
          severity: warning
        annotations:
          summary: Dockyard maintenance mode has remained enabled
          description: At least one resource scope has been in maintenance mode for four hours.

      - alert: DockyardRemoteClusterHeartbeatMissing
        expr: dockyard_cluster_heartbeat_missing == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: A remote Dockyard cluster has stopped heartbeating
          description: Cluster {{ $labels.cluster }} in organization {{ $labels.organization }} has been silent for more than two minutes or has never completed its first heartbeat.

      - alert: DockyardAgentUpgradeRollback
        expr: dockyard_cluster_agent_update_failure == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: A remote agent upgrade paused or rolled back
          description: Cluster {{ $labels.cluster }} reports Swarm update state {{ $labels.state }}; inspect the service and upgrade history before retrying.

      - alert: DockyardAgentUpgradeVerificationOverdue
        expr: dockyard_agent_upgrade_verification_overdue > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: A remote agent upgrade missed its verification deadline
          description: Cluster {{ $labels.cluster }} did not confirm the requested image digest before the controller deadline.

      - alert: DockyardAgentUpgradeStalled
        expr: dockyard_agent_upgrade_active_age_seconds{status=~"pending|leased"} > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A remote agent upgrade is stalled
          description: Cluster {{ $labels.cluster }} has had an upgrade in {{ $labels.status }} state for more than fifteen minutes.

      - alert: DockyardAgentCertificateExpiring
        expr: dockyard_cluster_certificate_expiry_seconds > 0 and dockyard_cluster_certificate_expiry_seconds < 79200
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A remote agent certificate is approaching expiry
          description: Cluster {{ $labels.cluster }} has less than 22 hours of certificate validity and automatic rotation has not replaced it.

      - alert: DockyardAgentCertificateExpired
        expr: dockyard_cluster_certificate_expiry_seconds <= 0
        labels:
          severity: critical
        annotations:
          summary: A remote agent certificate expired
          description: Cluster {{ $labels.cluster }} can no longer authenticate until it is re-enrolled.

      - alert: DockyardAgentCertificateRotationStalled
        expr: dockyard_cluster_certificate_rotation_pending_age_seconds > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: A remote agent certificate rotation is stalled
          description: Cluster {{ $labels.cluster }} has not authenticated with its issued replacement certificate.

      - alert: DockyardCustomTLSCertificateExpiring
        expr: dockyard_custom_tls_certificate_expiry_seconds > 0 and dockyard_custom_tls_certificate_expiry_seconds < 2592000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A custom edge TLS certificate is approaching expiry
          description: Certificate {{ $labels.certificate }} expires in less than thirty days; rotate it in organization settings.

      - alert: DockyardCustomTLSCertificateExpired
        expr: dockyard_custom_tls_certificate_expiry_seconds <= 0
        labels:
          severity: critical
        annotations:
          summary: A custom edge TLS certificate expired
          description: Certificate {{ $labels.certificate }} is expired and attached HTTPS routes may be unavailable.

      - alert: DockyardEdgeTLSReconciliationFailed
        expr: dockyard_edge_tls_reconciliation{status="error"} == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Edge TLS certificate reconciliation failed
          description: Target {{ $labels.target }} exhausted its retries; inspect the worker and Traefik edge service before deploying attached workloads.

      - alert: DockyardEdgeTLSReconciliationStalled
        expr: dockyard_edge_tls_reconciliation_age_seconds{status="pending"} > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Edge TLS certificate reconciliation is stalled
          description: Target {{ $labels.target }} has remained pending for more than five minutes.

      - alert: DockyardControlPlaneCertificateExpiring
        expr: dockyard_control_plane_certificate_expiry_seconds > 0 and dockyard_control_plane_certificate_expiry_seconds < 604800
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A Dockyard control-plane certificate is approaching expiry
          description: The {{ $labels.certificate }} certificate expires in less than seven days; rotate its Swarm secret and roll the controllers.

      - alert: DockyardControlPlaneCertificateExpired
        expr: dockyard_control_plane_certificate_expiry_seconds <= 0
        labels:
          severity: critical
        annotations:
          summary: A Dockyard control-plane certificate expired
          description: The {{ $labels.certificate }} certificate is expired and remote agent authentication is impaired.

      - alert: DockyardServiceAccountTokenExpiring
        expr: dockyard_service_account_token_expiry_seconds > 0 and dockyard_service_account_token_expiry_seconds < 604800
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A Dockyard service-account token is approaching expiry
          description: Service account {{ $labels.account }} ({{ $labels.role }}) expires in less than seven days; rotate its token and update the consuming secret.

      - alert: DockyardServiceAccountTokenExpired
        expr: dockyard_service_account_token_expiry_seconds <= 0
        labels:
          severity: critical
        annotations:
          summary: A Dockyard service-account token expired
          description: Service account {{ $labels.account }} ({{ $labels.role }}) can no longer authenticate; rotate its token or disable the identity.

      - alert: DockyardDeployTokenExpiring
        expr: dockyard_deploy_token_expiry_seconds > 0 and dockyard_deploy_token_expiry_seconds < 604800
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A Dockyard deployment-hook token is approaching expiry
          description: Deploy token {{ $labels.token }} for service {{ $labels.service }} expires in less than seven days; replace the CI secret and revoke the old credential.

      - alert: DockyardDeployTokenExpired
        expr: dockyard_deploy_token_expiry_seconds <= 0
        labels:
          severity: warning
        annotations:
          summary: A Dockyard deployment-hook token expired
          description: Deploy token {{ $labels.token }} can no longer trigger service {{ $labels.service }} and should be revoked after its CI consumer is updated.

      - alert: DockyardSourceCredentialRotationOverdue
        expr: dockyard_source_credential_rotation_age_seconds > 15552000
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: A referenced Dockyard source credential is overdue for rotation
          description: Source credential {{ $labels.credential }} ({{ $labels.kind }}) in organization {{ $labels.organization }} has not been rotated for more than 180 days; rotate it in place and verify its bound consumers.

      - alert: DockyardBackupDestinationCredentialRotationOverdue
        expr: dockyard_backup_destination_credential_rotation_age_seconds > 15552000
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Referenced Dockyard backup credentials are overdue for rotation
          description: Backup destination {{ $labels.destination }} in organization {{ $labels.organization }} has used the same object-store credentials for more than 180 days; rotate them in place and verify backup and restore.

      - alert: DockyardBackupDestinationPlaintextTransport
        expr: dockyard_backup_destination_tls == 0
        labels:
          severity: critical
        annotations:
          summary: A referenced Dockyard backup destination does not use TLS
          description: Backup destination {{ $labels.destination }} in organization {{ $labels.organization }} can expose object-store credentials in transit; move it to a certificate-validated HTTPS endpoint before running backup or restore operations.

      - alert: DockyardResourceFinalizerRequiresIntervention
        expr: dockyard_resource_finalizers{state=~"failed|missing"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: A Dockyard resource deletion cannot make progress
          description: Organization {{ $labels.organization }} has {{ $value }} {{ $labels.kind }} deletion(s) with a failed or missing finalizer job.

      - alert: DockyardResourceFinalizerStalled
        expr: dockyard_resource_finalizer_oldest_age_seconds > 900 unless on (organization, kind) dockyard_resource_finalizers{state=~"failed|missing"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A Dockyard resource deletion is stalled
          description: Organization {{ $labels.organization }} has a {{ $labels.kind }} deletion pending for more than fifteen minutes.

      - alert: DockyardManagedNetworkProvisioningFailed
        expr: dockyard_managed_networks{status="error"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: A Dockyard managed network could not be reconciled
          description: Organization {{ $labels.organization }} has {{ $value }} failed {{ $labels.scope }} {{ $labels.driver }} network(s); inspect the network state and durable job failure before retrying.

      - alert: DockyardManagedNetworkProvisioningStalled
        expr: dockyard_managed_network_provisioning_age_seconds > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A Dockyard managed network is still provisioning
          description: Managed network {{ $labels.network }} in organization {{ $labels.organization }} has not become ready within fifteen minutes.

      - alert: DockyardSCIMTokenExpiring
        expr: dockyard_scim_token_expiry_seconds > 0 and dockyard_scim_token_expiry_seconds < 604800
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A Dockyard SCIM token is approaching expiry
          description: SCIM token {{ $labels.token }} expires in less than seven days; replace it in the identity provider and revoke the old token.

      - alert: DockyardSCIMTokenExpired
        expr: dockyard_scim_token_expiry_seconds <= 0
        labels:
          severity: critical
        annotations:
          summary: A Dockyard SCIM token expired
          description: SCIM token {{ $labels.token }} can no longer provision identities; issue a replacement and update the identity provider.

      - alert: DockyardCredentialCleanupBacklog
        expr: dockyard_expired_credential_backlog > 0
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: Dockyard credential cleanup is not keeping pace
          description: More than two hourly cleanup passes have left {{ $value }} expired {{ $labels.kind }} record(s); inspect the audit-pruner controller lease and database health.

      - alert: DockyardSAMLCertificateExpiring
        expr: dockyard_saml_certificate_expiry_seconds > 0 and dockyard_saml_certificate_expiry_seconds < 2592000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A Dockyard SAML certificate is approaching expiry
          description: SAML provider {{ $labels.provider }} {{ $labels.kind }} trust expires in less than thirty days; complete the provider rollover before login is interrupted.

      - alert: DockyardSAMLCertificateExpired
        expr: dockyard_saml_certificate_expiry_seconds <= 0
        labels:
          severity: critical
        annotations:
          summary: A Dockyard SAML certificate expired
          description: SAML provider {{ $labels.provider }} {{ $labels.kind }} trust has expired and federated login is impaired.

      - alert: DockyardSAMLCertificateInvalid
        expr: dockyard_saml_certificate_valid == 0 unless on (organization, provider, kind) dockyard_saml_certificate_expiry_seconds <= 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: A Dockyard SAML certificate configuration is unusable
          description: SAML provider {{ $labels.provider }} {{ $labels.kind }} certificate material is malformed or not currently valid.

      - alert: DockyardSAMLCertificateRotationStalled
        expr: dockyard_saml_certificate_rotation_pending_age_seconds > 604800
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A Dockyard SAML certificate rotation is stalled
          description: SAML provider {{ $labels.provider }} has published a replacement signing certificate for more than seven days without promotion or cancellation.
