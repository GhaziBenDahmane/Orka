groups:
  - name: dockyard-control-plane
    rules:
      - alert: DockyardControllerDown
        expr: up{job="dockyard"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Dockyard controller is unavailable
          description: Prometheus has been unable to scrape Dockyard for two minutes.

      - alert: DockyardStaleJobLease
        expr: dockyard_job_stale_leases > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: A Dockyard worker lease is stale
          description: At least one running job has stopped heartbeating and may require recovery.

      - alert: DockyardQueueBacklog
        expr: max(dockyard_job_oldest_age_seconds{status="pending"}) > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Dockyard jobs are waiting too long
          description: The oldest pending job has been queued for more than five minutes.

      - alert: DockyardOperationFailures
        expr: sum(increase(dockyard_operations_total{status="failed"}[10m])) by (kind) > 0
        labels:
          severity: warning
        annotations:
          summary: Dockyard background operation failed
          description: One or more {{ $labels.kind }} operations failed in the last ten minutes.

      - alert: DockyardAIAuditFailed
        expr: dockyard_ai_audit_last_failure_age_seconds < 900
        labels:
          severity: warning
        annotations:
          summary: A Dockyard AI audit failed
          description: The AI auditor for organization {{ $labels.organization }} reported a failed run in the last fifteen minutes.

      - alert: DockyardAIAuditOverdue
        expr: dockyard_ai_audit_completion_overdue == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A Dockyard AI audit is overdue
          description: Organization {{ $labels.organization }} has an active auditor token but no completed audit within the expected 48-hour window.

      - alert: DockyardAIAuditStuck
        expr: dockyard_ai_audit_running_age_seconds > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A Dockyard AI audit is stuck
          description: An AI audit for organization {{ $labels.organization }} has remained running for more than ten minutes.

      - alert: DockyardNotificationDeliveryFailures
        expr: increase(dockyard_operations_total{kind="notify.webhook",status="failed"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: A Dockyard notification delivery attempt failed
          description: A notification endpoint rejected a delivery or was unavailable; the durable queue will retry it.

      - alert: DockyardBackupStale
        expr: dockyard_database_backup_last_success_age_seconds{scope="all"} > 86400
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: No successful Dockyard database backup in 24 hours
          description: Review backup policies, queue health, and remote storage availability.

      - alert: DockyardRestoreDrillOverdue
        expr: dockyard_restore_drill_overdue == 1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: A scheduled database restore drill is overdue
          description: Database {{ $labels.database }} has no successful restore drill within twice its configured backup interval (minimum 24 hours).

      - alert: DockyardDatabaseMigrationStalled
        expr: dockyard_database_migration_active_age_seconds > 7200
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: A Dokploy database transfer is stalled
          description: Database {{ $labels.database }} has had a queued or running native migration for more than two hours.

      - alert: DockyardDatabaseMigrationFailed
        expr: dockyard_database_migration_last_failure_age_seconds{scope="all"} < 900
        labels:
          severity: critical
        annotations:
          summary: A Dokploy database transfer failed
          description: A destructive native database migration exhausted its retries in the last fifteen minutes.

      - alert: DockyardMaintenanceModeLeftEnabled
        expr: sum(dockyard_maintenance_scopes) > 0
        for: 4h
        labels:
          severity: warning
        annotations:
          summary: Dockyard maintenance mode has remained enabled
          description: At least one resource scope has been in maintenance mode for four hours.

      - alert: DockyardRemoteClusterHeartbeatMissing
        expr: dockyard_cluster_heartbeat_missing == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: A remote Dockyard cluster has stopped heartbeating
          description: Cluster {{ $labels.cluster }} in organization {{ $labels.organization }} has been silent for more than two minutes or has never completed its first heartbeat.

      - alert: DockyardAgentUpgradeRollback
        expr: dockyard_cluster_agent_update_failure == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: A remote agent upgrade paused or rolled back
          description: Cluster {{ $labels.cluster }} reports Swarm update state {{ $labels.state }}; inspect the service and upgrade history before retrying.

      - alert: DockyardAgentUpgradeVerificationOverdue
        expr: dockyard_agent_upgrade_verification_overdue > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: A remote agent upgrade missed its verification deadline
          description: Cluster {{ $labels.cluster }} did not confirm the requested image digest before the controller deadline.

      - alert: DockyardAgentUpgradeStalled
        expr: dockyard_agent_upgrade_active_age_seconds{status=~"pending|leased"} > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A remote agent upgrade is stalled
          description: Cluster {{ $labels.cluster }} has had an upgrade in {{ $labels.status }} state for more than fifteen minutes.

      - alert: DockyardAgentCertificateExpiring
        expr: dockyard_cluster_certificate_expiry_seconds > 0 and dockyard_cluster_certificate_expiry_seconds < 79200
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A remote agent certificate is approaching expiry
          description: Cluster {{ $labels.cluster }} has less than 22 hours of certificate validity and automatic rotation has not replaced it.

      - alert: DockyardAgentCertificateExpired
        expr: dockyard_cluster_certificate_expiry_seconds <= 0
        labels:
          severity: critical
        annotations:
          summary: A remote agent certificate expired
          description: Cluster {{ $labels.cluster }} can no longer authenticate until it is re-enrolled.

      - alert: DockyardAgentCertificateRotationStalled
        expr: dockyard_cluster_certificate_rotation_pending_age_seconds > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: A remote agent certificate rotation is stalled
          description: Cluster {{ $labels.cluster }} has not authenticated with its issued replacement certificate.

      - alert: DockyardControlPlaneCertificateExpiring
        expr: dockyard_control_plane_certificate_expiry_seconds > 0 and dockyard_control_plane_certificate_expiry_seconds < 604800
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A Dockyard control-plane certificate is approaching expiry
          description: The {{ $labels.certificate }} certificate expires in less than seven days; rotate its Swarm secret and roll the controllers.

      - alert: DockyardControlPlaneCertificateExpired
        expr: dockyard_control_plane_certificate_expiry_seconds <= 0
        labels:
          severity: critical
        annotations:
          summary: A Dockyard control-plane certificate expired
          description: The {{ $labels.certificate }} certificate is expired and remote agent authentication is impaired.

      - alert: DockyardServiceAccountTokenExpiring
        expr: dockyard_service_account_token_expiry_seconds > 0 and dockyard_service_account_token_expiry_seconds < 604800
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A Dockyard service-account token is approaching expiry
          description: Service account {{ $labels.account }} ({{ $labels.role }}) expires in less than seven days; rotate its token and update the consuming secret.

      - alert: DockyardServiceAccountTokenExpired
        expr: dockyard_service_account_token_expiry_seconds <= 0
        labels:
          severity: critical
        annotations:
          summary: A Dockyard service-account token expired
          description: Service account {{ $labels.account }} ({{ $labels.role }}) can no longer authenticate; rotate its token or disable the identity.
