rule_files:
  - prometheus-alerts.yml

evaluation_interval: 1m

tests:
  - name: healthy homogeneous three-controller fleet
    interval: 1m
    input_series:
      - series: 'dockyard_controller_build_info{instance="10.0.0.1:8080",version="v1.0.0",revision="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}'
        values: '1x10'
      - series: 'dockyard_controller_build_info{instance="10.0.0.2:8080",version="v1.0.0",revision="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}'
        values: '1x10'
      - series: 'dockyard_controller_build_info{instance="10.0.0.3:8080",version="v1.0.0",revision="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}'
        values: '1x10'
      - series: 'dockyard_controller_expected_replicas{instance="10.0.0.1:8080"}'
        values: '3x10'
      - series: 'dockyard_controller_expected_replicas{instance="10.0.0.2:8080"}'
        values: '3x10'
      - series: 'dockyard_controller_expected_replicas{instance="10.0.0.3:8080"}'
        values: '3x10'
      - series: 'dockyard_database_driver_inventory_info{instance="10.0.0.1:8080",digest="sha256:drivers"}'
        values: '1x10'
      - series: 'dockyard_database_driver_inventory_info{instance="10.0.0.2:8080",digest="sha256:drivers"}'
        values: '1x10'
      - series: 'dockyard_database_driver_inventory_info{instance="10.0.0.3:8080",digest="sha256:drivers"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: DockyardControllerReplicaShortfall
        exp_alerts: []
      - eval_time: 6m
        alertname: DockyardControllerBuildFleetMismatch
        exp_alerts: []
      - eval_time: 6m
        alertname: DockyardDatabaseDriverFleetMismatch
        exp_alerts: []

  - name: missing controller target
    interval: 1m
    input_series:
      - series: 'dockyard_controller_build_info{instance="10.0.0.1:8080",version="v1.0.0",revision="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}'
        values: '1x10'
      - series: 'dockyard_controller_build_info{instance="10.0.0.2:8080",version="v1.0.0",revision="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}'
        values: '1x10'
      - series: 'dockyard_controller_expected_replicas{instance="10.0.0.1:8080"}'
        values: '3x10'
      - series: 'dockyard_controller_expected_replicas{instance="10.0.0.2:8080"}'
        values: '3x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: DockyardControllerReplicaShortfall
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Fewer Dockyard controller replicas are being scraped than configured
              description: Prometheus cannot see the configured number of controller tasks. Check Swarm task health and tasks.<stack>_dockyard DNS discovery before trusting fleet-wide consistency alerts.

  - name: mixed controller builds and database drivers
    interval: 1m
    input_series:
      - series: 'dockyard_controller_build_info{instance="10.0.0.1:8080",version="v1.0.0",revision="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}'
        values: '1x10'
      - series: 'dockyard_controller_build_info{instance="10.0.0.2:8080",version="v1.0.1",revision="bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"}'
        values: '1x10'
      - series: 'dockyard_controller_build_info{instance="10.0.0.3:8080",version="v1.0.1",revision="bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"}'
        values: '1x10'
      - series: 'dockyard_controller_expected_replicas{instance="10.0.0.1:8080"}'
        values: '3x10'
      - series: 'dockyard_controller_expected_replicas{instance="10.0.0.2:8080"}'
        values: '3x10'
      - series: 'dockyard_controller_expected_replicas{instance="10.0.0.3:8080"}'
        values: '3x10'
      - series: 'dockyard_database_driver_inventory_info{instance="10.0.0.1:8080",digest="sha256:old"}'
        values: '1x10'
      - series: 'dockyard_database_driver_inventory_info{instance="10.0.0.2:8080",digest="sha256:new"}'
        values: '1x10'
      - series: 'dockyard_database_driver_inventory_info{instance="10.0.0.3:8080",digest="sha256:new"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: DockyardControllerReplicaShortfall
        exp_alerts: []
      - eval_time: 6m
        alertname: DockyardControllerBuildFleetMismatch
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Dockyard controllers are running different builds
              description: Scraped controller replicas report different immutable version or source-revision identities; finish or roll back the controller update before control-plane maintenance.
      - eval_time: 6m
        alertname: DockyardDatabaseDriverFleetMismatch
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Dockyard controllers loaded different database drivers
              description: Scraped controller replicas report different database-driver inventories; stop database recovery and migration work until every replica runs the reviewed artifacts.

  - name: database utility provenance missing
    interval: 1m
    input_series:
      - series: 'dockyard_database_utility_provenance_issues{operation="backup",role="utility"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: DockyardDatabaseUtilityProvenanceMissing
        exp_alerts:
          - exp_labels:
              operation: backup
              role: utility
              severity: critical
            exp_annotations:
              summary: Database recovery evidence uses an unverified utility image
              description: Successful backup evidence is missing a digest-pinned image for role utility; complete a fresh verified operation before relying on that recovery evidence.

  - name: plaintext backup destination
    interval: 1m
    input_series:
      - series: 'dockyard_backup_destination_tls{organization="organization-id",destination="destination-id"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 1m
        alertname: DockyardBackupDestinationPlaintextTransport
        exp_alerts:
          - exp_labels:
              organization: organization-id
              destination: destination-id
              severity: critical
            exp_annotations:
              summary: A referenced Dockyard backup destination does not use TLS
              description: Backup destination destination-id in organization organization-id can expose object-store credentials in transit; move it to a certificate-validated HTTPS endpoint before running backup or restore operations.

  - name: overdue database backup
    interval: 1m
    input_series:
      - series: 'dockyard_database_backup_overdue{database="database-id"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: DockyardDatabaseBackupOverdue
        exp_alerts:
          - exp_labels:
              database: database-id
              severity: critical
            exp_annotations:
              summary: A database backup is overdue
              description: Database database-id has no successful encrypted backup within twice its configured interval.

  - name: database recovery policy gaps
    interval: 1m
    input_series:
      - series: 'dockyard_database_backup_policy_status{database="missing-policy-id",state="missing"}'
        values: '1x20'
      - series: 'dockyard_database_backup_policy_status{database="disabled-policy-id",state="disabled"}'
        values: '1x20'
      - series: 'dockyard_database_restore_verification_enabled{database="unverified-id"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: DockyardDatabaseBackupPolicyUnavailable
        exp_alerts:
          - exp_labels:
              database: missing-policy-id
              state: missing
              severity: critical
            exp_annotations:
              summary: A managed database has no active backup policy
              description: Database missing-policy-id has backup-policy state missing; configure and enable a retained remote backup policy.
          - exp_labels:
              database: disabled-policy-id
              state: disabled
              severity: critical
            exp_annotations:
              summary: A managed database has no active backup policy
              description: Database disabled-policy-id has backup-policy state disabled; configure and enable a retained remote backup policy.
      - eval_time: 16m
        alertname: DockyardDatabaseRestoreVerificationDisabled
        exp_alerts:
          - exp_labels:
              database: unverified-id
              severity: warning
            exp_annotations:
              summary: Automatic database restore verification is disabled
              description: Database unverified-id has scheduled backups but does not exercise them through isolated restore drills.

  - name: named-volume recovery policy gaps
    interval: 1m
    input_series:
      - series: 'dockyard_volume_backup_policy_status{service="service-id",volume="uploads",state="missing"}'
        values: '1x20'
      - series: 'dockyard_volume_backup_policy_status{service="service-id",volume="cache",state="disabled"}'
        values: '1x20'
      - series: 'dockyard_volume_backup_policy_inventory_valid{service="malformed-service-id"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: DockyardVolumeBackupPolicyUnavailable
        exp_alerts:
          - exp_labels:
              service: service-id
              volume: uploads
              state: missing
              severity: critical
            exp_annotations:
              summary: A mounted named volume has no active backup policy
              description: Service service-id volume uploads has backup-policy state missing; configure and enable an encrypted retained backup policy.
          - exp_labels:
              service: service-id
              volume: cache
              state: disabled
              severity: critical
            exp_annotations:
              summary: A mounted named volume has no active backup policy
              description: Service service-id volume cache has backup-policy state disabled; configure and enable an encrypted retained backup policy.
      - eval_time: 16m
        alertname: DockyardVolumeBackupPolicyInventoryInvalid
        exp_alerts:
          - exp_labels:
              service: malformed-service-id
              severity: warning
            exp_annotations:
              summary: Named-volume backup coverage cannot be evaluated
              description: Service malformed-service-id has an invalid Compose volume definition; fix it before relying on backup-policy coverage alerts.
