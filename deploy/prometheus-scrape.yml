# Merge this job into the configuration of a Prometheus Swarm service attached
# to the Dockyard stack's private `<stack>_metrics` overlay network. Replace
# `dockyard` in the DNS name when DOCKYARD_STACK_NAME is not `dockyard`.
scrape_configs:
  - job_name: dockyard
    scrape_interval: 15s
    scrape_timeout: 5s
    metrics_path: /metrics
    scheme: http
    bearer_token_file: /run/secrets/dockyard_metrics_token
    dns_sd_configs:
      - names:
          - tasks.dockyard_dockyard
        type: A
        port: 8080
        refresh_interval: 15s
