services:
  postgres:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE to an immutable digest}
    environment:
      POSTGRES_USER: dockyard
      POSTGRES_PASSWORD_FILE: /run/secrets/dockyard_db_password
      POSTGRES_DB: dockyard
    secrets: [dockyard_db_password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [control]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username dockyard --dbname dockyard"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 30s

  dockyard:
    image: ${DOCKYARD_IMAGE:?set DOCKYARD_IMAGE to an immutable digest}
    environment:
      DOCKYARD_DATABASE_URL_FILE: /run/secrets/dockyard_database_url
      DOCKYARD_MASTER_KEY_FILE: /run/secrets/dockyard_master_key
      DOCKYARD_TRAEFIK_NETWORK: dockyard-public
      DOCKYARD_TRUSTED_PROXY_CIDRS: ${DOCKYARD_EDGE_SUBNET:-10.255.250.0/24}
      DOCKYARD_PUBLIC_URL: https://${DOCKYARD_HOST}
      DOCKYARD_BACKUP_DIRECTORY: /var/lib/dockyard/backups
      DOCKYARD_OTEL_EXPORTER_OTLP_ENDPOINT: ${DOCKYARD_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      DOCKYARD_OTEL_EXPORTER_OTLP_INSECURE: ${DOCKYARD_OTEL_EXPORTER_OTLP_INSECURE:-false}
      DOCKYARD_OTEL_SERVICE_NAME: ${DOCKYARD_OTEL_SERVICE_NAME:-dockyard}
    secrets: [dockyard_database_url, dockyard_master_key]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/dockyard/backups:/var/lib/dockyard/backups
    networks: [control, edge-control]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 30s
      labels:
        traefik.enable: "true"
        traefik.http.routers.dockyard.rule: Host(`${DOCKYARD_HOST}`)
        traefik.http.routers.dockyard.entrypoints: websecure
        traefik.http.routers.dockyard.tls: "true"
        traefik.http.routers.dockyard.tls.certresolver: letsencrypt
        traefik.http.services.dockyard.loadbalancer.server.port: "8080"
        traefik.docker.network: dockyard-edge-control

  traefik:
    image: ${TRAEFIK_IMAGE:?set TRAEFIK_IMAGE to an immutable digest}
    command:
      - --providers.swarm=true
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=dockyard-public
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --ping=true
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/data/acme.json
    ports:
      - {target: 80, published: 80, mode: host}
      - {target: 443, published: 443, mode: host}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-data:/data
    networks: [dockyard-public, edge-control]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 30s

networks:
  control:
    driver: overlay
    driver_opts:
      encrypted: ""
  edge-control:
    name: dockyard-edge-control
    driver: overlay
    driver_opts:
      encrypted: ""
    ipam:
      config:
        - subnet: ${DOCKYARD_EDGE_SUBNET:-10.255.250.0/24}
  dockyard-public: {external: true}
volumes:
  postgres-data: {}
  traefik-data: {}
secrets:
  dockyard_db_password: {external: true}
  dockyard_database_url: {external: true}
  dockyard_master_key:
    external: true
    name: ${DOCKYARD_MASTER_KEY_SECRET:-dockyard_master_key}
