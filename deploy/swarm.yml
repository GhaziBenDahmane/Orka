services:
  postgres:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE to an immutable digest}
    stop_grace_period: 1m
    environment:
      POSTGRES_USER: dockyard
      POSTGRES_PASSWORD_FILE: /run/secrets/dockyard_db_password
      POSTGRES_DB: dockyard
    secrets: [dockyard_db_password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [control]
    logging:
      driver: local
      options:
        max-size: ${DOCKYARD_CONTAINER_LOG_MAX_SIZE:-20m}
        max-file: ${DOCKYARD_CONTAINER_LOG_MAX_FILES:-5}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username dockyard --dbname dockyard"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: ${DOCKYARD_POSTGRES_CPU_LIMIT:-2.0}
          memory: ${DOCKYARD_POSTGRES_MEMORY_LIMIT:-2G}
        reservations:
          cpus: ${DOCKYARD_POSTGRES_CPU_RESERVATION:-0.25}
          memory: ${DOCKYARD_POSTGRES_MEMORY_RESERVATION:-256M}
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 30s

  dockyard:
    image: ${DOCKYARD_IMAGE:?set DOCKYARD_IMAGE to an immutable digest}
    stop_grace_period: 30s
    environment:
      DOCKYARD_DATABASE_URL_FILE: /run/secrets/dockyard_database_url
      DOCKYARD_MASTER_KEY_FILE: /run/secrets/dockyard_master_key
      DOCKYARD_METRICS_TOKEN_FILE: /run/secrets/dockyard_metrics_token
      DOCKYARD_TRAEFIK_NETWORK: ${DOCKYARD_TRAEFIK_NETWORK:-dockyard-public}
      DOCKYARD_TRUSTED_PROXY_CIDRS: ${DOCKYARD_EDGE_SUBNET:-10.255.250.0/24}
      DOCKYARD_PUBLIC_URL: https://${DOCKYARD_HOST}
      DOCKYARD_BACKUP_DIRECTORY: /var/lib/dockyard/backups
      DOCKYARD_MAX_BUILD_WORKSPACE_BYTES: ${DOCKYARD_MAX_BUILD_WORKSPACE_BYTES:-805306368}
      DOCKYARD_OTEL_EXPORTER_OTLP_ENDPOINT: ${DOCKYARD_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      DOCKYARD_OTEL_EXPORTER_OTLP_INSECURE: ${DOCKYARD_OTEL_EXPORTER_OTLP_INSECURE:-false}
      DOCKYARD_OTEL_SERVICE_NAME: ${DOCKYARD_OTEL_SERVICE_NAME:-dockyard}
      DOCKYARD_SWARM_SERVICE_NAME: ${DOCKYARD_SWARM_SERVICE_NAME:-dockyard_dockyard}
      DOCKYARD_EGRESS_PRIVATE_CIDRS: ${DOCKYARD_EGRESS_PRIVATE_CIDRS:-}
      HOME: /tmp/dockyard-home
      XDG_CACHE_HOME: /tmp/dockyard-cache
    secrets: [dockyard_database_url, dockyard_master_key, dockyard_metrics_token]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - backup-artifacts:/var/lib/dockyard/backups
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1073741824,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [control, edge-control]
    logging:
      driver: local
      options:
        max-size: ${DOCKYARD_CONTAINER_LOG_MAX_SIZE:-20m}
        max-file: ${DOCKYARD_CONTAINER_LOG_MAX_FILES:-5}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: ${DOCKYARD_CONTROLLER_CPU_LIMIT:-4.0}
          memory: ${DOCKYARD_CONTROLLER_MEMORY_LIMIT:-4G}
        reservations:
          cpus: ${DOCKYARD_CONTROLLER_CPU_RESERVATION:-0.25}
          memory: ${DOCKYARD_CONTROLLER_MEMORY_RESERVATION:-256M}
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 30s
      labels:
        traefik.enable: "true"
        traefik.http.routers.dockyard.rule: Host(`${DOCKYARD_HOST}`)
        traefik.http.routers.dockyard.entrypoints: websecure
        traefik.http.routers.dockyard.tls: "true"
        traefik.http.routers.dockyard.tls.certresolver: letsencrypt
        traefik.http.services.dockyard.loadbalancer.server.port: "8080"
        traefik.docker.network: dockyard-edge-control

  traefik:
    image: ${TRAEFIK_IMAGE:?set TRAEFIK_IMAGE to an immutable digest}
    stop_grace_period: 30s
    command:
      - --providers.swarm=true
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=${DOCKYARD_TRAEFIK_NETWORK:-dockyard-public}
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --ping=true
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/data/acme.json
    ports:
      - {target: 80, published: 80, mode: host}
      - {target: 443, published: 443, mode: host}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-data:/data
    configs:
      - source: traefik_dynamic_base
        target: /etc/traefik/dynamic/base.yml
    networks: [dockyard-public, edge-control]
    logging:
      driver: local
      options:
        max-size: ${DOCKYARD_CONTAINER_LOG_MAX_SIZE:-20m}
        max-file: ${DOCKYARD_CONTAINER_LOG_MAX_FILES:-5}
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: ${DOCKYARD_TRAEFIK_CPU_LIMIT:-1.0}
          memory: ${DOCKYARD_TRAEFIK_MEMORY_LIMIT:-512M}
        reservations:
          cpus: ${DOCKYARD_TRAEFIK_CPU_RESERVATION:-0.10}
          memory: ${DOCKYARD_TRAEFIK_MEMORY_RESERVATION:-64M}
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 30s

networks:
  control:
    driver: overlay
    driver_opts:
      encrypted: ""
  edge-control:
    name: dockyard-edge-control
    driver: overlay
    driver_opts:
      encrypted: ""
    ipam:
      config:
        - subnet: ${DOCKYARD_EDGE_SUBNET:-10.255.250.0/24}
  dockyard-public:
    external: true
    name: ${DOCKYARD_TRAEFIK_NETWORK:-dockyard-public}
volumes:
  backup-artifacts: {}
  postgres-data: {}
  traefik-data: {}
configs:
  traefik_dynamic_base:
    file: ./traefik-dynamic-base.yml
secrets:
  dockyard_db_password:
    external: true
    name: ${DOCKYARD_DB_PASSWORD_SECRET:-dockyard_db_password}
  dockyard_database_url:
    external: true
    name: ${DOCKYARD_DATABASE_URL_SECRET:-dockyard_database_url}
  dockyard_master_key:
    external: true
    name: ${DOCKYARD_MASTER_KEY_SECRET:-dockyard_master_key}
  dockyard_metrics_token:
    external: true
    name: ${DOCKYARD_METRICS_TOKEN_SECRET:-dockyard_metrics_token}
