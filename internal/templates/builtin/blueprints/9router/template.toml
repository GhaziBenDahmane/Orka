[variables]
domain = "${domain}"
router_version = "latest"
headroom_version = "latest"

[config.env]
ROUTER_VERSION = "${router_version}"
HEADROOM_VERSION = "${headroom_version}"
DATA_DIR = "/app/data"
PORT = "20128"
HOSTNAME = "0.0.0.0"
NODE_ENV = "production"
HEADROOM_URL = "http://headroom:8787"

[[config.domains]]
serviceName = "router"
port = 20128
host = "${domain}"
path = "/"
