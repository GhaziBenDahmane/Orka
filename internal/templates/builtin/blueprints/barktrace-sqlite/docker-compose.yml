services:
  barktrace:
    image: ghcr.io/barktrace/bark:${BARKTRACE_VERSION}
    environment:
      BARKTRACE_PUBLIC_URL: ${BARKTRACE_PUBLIC_URL}
      BARKTRACE_DEFAULT_ORG_NAME: ${BARKTRACE_DEFAULT_ORG_NAME}
      BARKTRACE_DEFAULT_ORG_SLUG: ${BARKTRACE_DEFAULT_ORG_SLUG}
      BARKTRACE_AUTO_PROVISION: ${BARKTRACE_AUTO_PROVISION}
      BARKTRACE_SESSION_LIFETIME_HOURS: ${BARKTRACE_SESSION_LIFETIME_HOURS}
      BARKTRACE_MCP_TOKEN: ${BARKTRACE_MCP_TOKEN}
      BARKTRACE_UPTIME_ALLOW_PRIVATE_TARGETS: ${BARKTRACE_UPTIME_ALLOW_PRIVATE_TARGETS}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME}
      OIDC_SCOPES: ${OIDC_SCOPES}
      OIDC_REQUIRE_EMAIL_VERIFIED: ${OIDC_REQUIRE_EMAIL_VERIFIED}
      GOMEMLIMIT: ${GOMEMLIMIT}
    volumes:
      - barktrace-data:/data
    healthcheck:
      test: ["CMD", "/app/barktrace", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 5
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
volumes:
  barktrace-data: {}
