components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    mutualTLS:
      type: mutualTLS
  schemas:
    DatabaseEngine:
      type: object
      required: [name, defaultVersion, source, backupCapable, backupExtension]
      properties:
        name: {type: string}
        defaultVersion: {type: string}
        source: {type: string, enum: [built-in, external]}
        artifactDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        backupCapable: {type: boolean}
        backupExtension: {type: string}
    DatabaseEngineList:
      type: object
      required: [items, backupCapable, engines]
      properties:
        items:
          type: array
          items: {type: string}
        backupCapable:
          type: array
          items: {type: string}
        engines:
          type: array
          items:
            $ref: '#/components/schemas/DatabaseEngine'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
