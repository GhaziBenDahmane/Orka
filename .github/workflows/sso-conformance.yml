name: SSO conformance
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: read
jobs:
  keycloak:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Run real Keycloak OIDC and SAML flows
        env:
          DOCKYARD_SSO_EVIDENCE: sso-keycloak-evidence.json
        run: |
          set -euo pipefail
          make test-keycloak-sso | tee sso-keycloak-conformance.log
          jq -e --arg sourceCommit "$GITHUB_SHA" '
            .schemaVersion == 1 and .status == "passed" and
            .sourceCommit == $sourceCommit and .provider == "keycloak" and
            (.keycloakImage | test("@sha256:[a-f0-9]{64}$")) and
            (.postgresImage | test("@sha256:[a-f0-9]{64}$")) and
            .flows.oidc == {test:"TestKeycloakOIDCConformance",status:"passed"} and
            .flows.saml == {test:"TestKeycloakSAMLConformance",status:"passed"} and
            .oidc and .samlSpInitiated and .samlIdpInitiated and
            .tenantIsolation and .replayRejected
          ' sso-keycloak-evidence.json >/dev/null
          jq -er '.keycloakImage,.postgresImage' sso-keycloak-evidence.json | while IFS= read -r image; do
            scripts/ci/validate-image-reference.sh "$image"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sso-keycloak-conformance
          path: |
            sso-keycloak-conformance.log
            sso-keycloak-evidence.json
          if-no-files-found: error
