name: SSO conformance
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: read
jobs:
  keycloak:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Run real Keycloak OIDC and SAML flows
        run: |
          set -euo pipefail
          make test-keycloak-sso | tee sso-keycloak-conformance.log
          jq -n \
            --arg createdAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sourceCommit "$GITHUB_SHA" \
            '{createdAt:$createdAt,sourceCommit:$sourceCommit,provider:"keycloak",oidc:true,samlSpInitiated:true,samlIdpInitiated:true,tenantIsolation:true,replayRejected:true}' \
            > sso-keycloak-evidence.json
          jq -e --arg sourceCommit "$GITHUB_SHA" '.sourceCommit == $sourceCommit and .provider == "keycloak" and .oidc and .samlSpInitiated and .samlIdpInitiated and .tenantIsolation and .replayRejected' sso-keycloak-evidence.json >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sso-keycloak-conformance
          path: |
            sso-keycloak-conformance.log
            sso-keycloak-evidence.json
          if-no-files-found: error
