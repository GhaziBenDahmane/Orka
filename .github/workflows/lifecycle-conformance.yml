name: Lifecycle conformance
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "47 3 * * 1"
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Exercise deployment and worker lifecycle
        run: make test-lifecycle-conformance | tee lifecycle-conformance.log
      - name: Validate lifecycle evidence
        run: |
          jq -e --arg sourceCommit "$GITHUB_SHA" '
            .sourceCommit == $sourceCommit and .status == "passed" and
            .deploySucceeded and .deployFailed and .deploymentCancelled and
            .rollbackSucceeded and .resolvedImageSnapshot and .signedWebhookAccepted and
            .webhookReplayRejected and .commitStatusDelivered and
            .failureNotificationDelivered and .workerTakeoverFenced and
            .staleCompletionRejected and .cancellationCompletionRace and
            .remoteAgentCommand and .deletionFinalizerRecovery
          ' lifecycle-conformance.json >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lifecycle-conformance
          path: |
            lifecycle-conformance.log
            lifecycle-conformance.json
          if-no-files-found: error
