name: Dokploy migration conformance
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "7 5 * * 1"
permissions:
  contents: read
jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Exercise Dokploy import and verification
        run: make test-migration-conformance | tee migration-conformance.log
      - name: Validate migration evidence
        run: |
          jq -e --arg sourceCommit "$GITHUB_SHA" '
            .sourceCommit == $sourceCommit and .status == "passed" and
            .postgresBacked and .dryRunSecretSafe and .controlPlaneImported and
            .idempotentImport and .composeImported and .applicationsImported and
            .routesImported and .databasesImported == 8 and
            .backupConfigurationImported and .sourceCredentialsReencrypted and
            .notificationsReencrypted and .databaseTransfersQueued == 8 and
            .transferSecretsEncrypted and .tenantOwnershipEnforced and
            .manualAcknowledgementsExplicit and .operationalVerifierFailClosed and
            .databaseBackupCutoverVerified and .volumeBackupCutoverVerified
          ' migration-conformance.json >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: migration-conformance
          path: |
            migration-conformance.log
            migration-conformance.json
          if-no-files-found: error
