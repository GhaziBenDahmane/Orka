name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/dockyard
      - run: docker compose config --quiet
      - run: DOCKYARD_HOST=dockyard.example.com ACME_EMAIL=ops@example.com DOCKYARD_IMAGE=example/dockyard:test docker stack config -c deploy/swarm.yml >/dev/null
