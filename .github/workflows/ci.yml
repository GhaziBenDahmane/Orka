name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dockyard
          POSTGRES_PASSWORD: dockyard
          POSTGRES_DB: dockyard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dockyard -d dockyard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DOCKYARD_TEST_DATABASE_URL: postgres://dockyard:dockyard@127.0.0.1:5432/dockyard_test?sslmode=disable
      DOCKYARD_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      DOCKYARD_TEST_S3_ACCESS_KEY: minioadmin
      DOCKYARD_TEST_S3_SECRET_KEY: minioadmin123
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web console
        working-directory: web
        run: npm ci && npm run build
      - name: Check generated assets
        run: git diff --exit-code -- internal/webui/dist
      - name: Check generated OpenAPI contract
        run: |
          go run ./tools/generate-openapi
          git diff --exit-code -- api/openapi.yaml
      - name: Validate built-in template catalog
        run: |
          go run ./cmd/dockyard validate-dokploy-templates internal/templates/builtin
          go run ./cmd/dockyard validate-dokploy-templates examples/template-repository
      - name: Start S3-compatible test storage
        run: |
          docker run -d --name dockyard-minio-test -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin123 \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for _ in {1..30}; do
            curl --fail --silent http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          exit 1
      - run: go test -race ./...
      - run: go vet ./...
      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - run: go build ./cmd/dockyard
      - run: go build ./cmd/terraform-provider-dockyard
      - run: docker compose config --quiet
      - name: Validate Prometheus alert rules
        run: make check-alerts
      - name: Check operational scripts
        run: |
          sh -n scripts/backup-control-plane.sh scripts/restore-control-plane.sh scripts/backup-ai-gateway.sh scripts/restore-ai-gateway.sh scripts/install-swarm.sh scripts/install-agent.sh scripts/install-ai-auditors.sh scripts/ci/check-image-digests.sh scripts/ci/validate-image-reference.sh scripts/ci/test-image-reference-validation.sh
          bash -n scripts/ci/smoke-compose.sh scripts/ci/smoke-templates.sh scripts/ci/test-agent-certificate-conformance.sh scripts/ci/test-ai-audit-conformance.sh scripts/ci/test-ai-gateway-recovery.sh scripts/ci/test-control-plane-recovery.sh scripts/ci/test-install-swarm.sh scripts/ci/test-install-agent.sh scripts/ci/test-install-ai-auditors.sh scripts/ci/test-keycloak-oidc.sh scripts/ci/test-lifecycle-conformance.sh scripts/ci/test-migration-conformance.sh scripts/ci/test-notification-conformance.sh scripts/ci/test-reconciliation-conformance.sh scripts/ci/test-release-soak.sh scripts/ci/test-release-upgrade.sh scripts/ci/test-swarm-ha.sh
          make test-install
      - name: Validate GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
      - name: Validate immutable production images
        env:
          DOCKYARD_IMAGE: example/dockyard@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          POSTGRES_IMAGE: postgres@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          TRAEFIK_IMAGE: traefik@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          NINEROUTER_IMAGE: example/9router@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
          NINEROUTER_STORAGE_NODE_ID: aaaaaaaaaaaaaaaaaaaaaaaaa
          HEADROOM_IMAGE: example/headroom@sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
          DOCKYARD_AI_MODEL: provider/model
          DOCKYARD_CONTROL_PLANE_URL: https://dockyard.example.com
        run: |
          scripts/ci/check-image-digests.sh build
          scripts/ci/check-image-digests.sh controller
          scripts/ci/check-image-digests.sh agent
          scripts/ci/check-image-digests.sh ai
          DOCKYARD_HOST=dockyard.example.com ACME_EMAIL=ops@example.com docker stack config -c deploy/swarm.yml >/dev/null
          DOCKYARD_HOST=dockyard.example.com ACME_EMAIL=ops@example.com docker stack config -c deploy/swarm.yml -c deploy/swarm-ha.yml >/dev/null
          DOCKYARD_HOST=dockyard.example.com ACME_EMAIL=ops@example.com docker stack config -c deploy/swarm.yml -c deploy/swarm-ha.yml -c deploy/swarm-agent-ca-rollover.yml >/dev/null
          docker stack config -c deploy/ai-auditors.yml >/dev/null

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Clean-install and restart smoke test
        env:
          DOCKYARD_CONTROL_PLANE_RECOVERY_EVIDENCE: ${{ github.workspace }}/control-plane-recovery-conformance.json
        run: |
          set -euo pipefail
          scripts/ci/smoke-compose.sh | tee control-plane-recovery-conformance.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: control-plane-recovery-conformance
          path: |
            control-plane-recovery-conformance.json
            control-plane-recovery-conformance.log
          if-no-files-found: error

  template-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Deploy and exercise built-in 9Router, PostgreSQL, Redis, and BarkTrace products
        env:
          DOCKYARD_TEMPLATE_EVIDENCE: template-conformance.json
        run: |
          set -euo pipefail
          scripts/ci/smoke-templates.sh | tee template-conformance.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: template-conformance
          path: |
            template-conformance.json
            template-conformance.log
          if-no-files-found: error

  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: License policy
        run: make check-licenses
      - name: Build release image
        run: docker build --tag dockyard:ci .
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1
        with:
          image: dockyard:ci
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dockyard-sbom
          path: sbom.spdx.json
          if-no-files-found: error
      - name: Scan release image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: dockyard:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
