name: Database recovery conformance
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        engine:
          - postgres
          - mysql
          - mariadb
          - mongo
          - redis
          - valkey
          - libsql
          - clickhouse
          - qdrant
          - meilisearch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Initialize isolated Swarm
        run: docker swarm init --advertise-addr 127.0.0.1
      - name: Exercise native backup and restore
        env:
          DOCKYARD_TEST_DATABASE_RECOVERY: "1"
          DOCKYARD_TEST_DATABASE_ENGINES: ${{ matrix.engine }}
          RECOVERY_ENGINE: ${{ matrix.engine }}
        run: |
          set -euo pipefail
          go test -timeout 35m -run TestNativeDatabaseRecoveryConformance -v -count=1 ./internal/database | tee recovery-conformance.log
          sed -n 's/^.*RECOVERY_EVIDENCE //p' recovery-conformance.log > "recovery-${RECOVERY_ENGINE}.json"
          jq -e --arg engine "$RECOVERY_ENGINE" \
            '.engine == $engine and .dataVerified == true and .restartVerified == true and .artifactBytes > 0 and .rpoSeconds >= 0 and .rtoSeconds >= 0' \
            "recovery-${RECOVERY_ENGINE}.json" >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: recovery-${{ matrix.engine }}
          path: |
            recovery-conformance.log
            recovery-${{ matrix.engine }}.json
          if-no-files-found: error
