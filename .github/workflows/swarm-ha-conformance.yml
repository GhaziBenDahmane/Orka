name: Swarm HA conformance

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "47 3 * * 1"

permissions:
  contents: read

jobs:
  manager-failover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Exercise manager failover and quorum loss
        run: |
          set -euo pipefail
          scripts/ci/test-swarm-ha.sh swarm-ha-conformance.json | tee swarm-ha-conformance.log
          jq -e --arg sourceCommit "$GITHUB_SHA" '.status == "passed" and .sourceCommit == $sourceCommit and (.dindImage | test("@sha256:[a-f0-9]{64}$")) and (.probeImage | test("@sha256:[a-f0-9]{64}$")) and .managers == 3 and .replicas == 3 and .minorityMutationRejected == true and .replicasConverged == true and .leaderFailoverSeconds >= 0 and .quorumRecoverySeconds >= 0' swarm-ha-conformance.json >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: swarm-ha-conformance
          path: |
            swarm-ha-conformance.json
            swarm-ha-conformance.log
          if-no-files-found: error
