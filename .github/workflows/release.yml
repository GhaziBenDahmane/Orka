name: Release image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: SemVer release tag, including the leading v
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  database-recovery:
    name: Verify database recovery
    uses: ./.github/workflows/database-recovery.yml
    permissions:
      contents: read

  sso-conformance:
    name: Verify SSO conformance
    uses: ./.github/workflows/sso-conformance.yml
    permissions:
      contents: read

  swarm-ha-conformance:
    name: Verify Swarm HA conformance
    uses: ./.github/workflows/swarm-ha-conformance.yml
    permissions:
      contents: read

  lifecycle-conformance:
    name: Verify deployment lifecycle
    uses: ./.github/workflows/lifecycle-conformance.yml
    permissions:
      contents: read

  reconciliation-conformance:
    name: Verify drift reconciliation
    uses: ./.github/workflows/reconciliation-conformance.yml
    permissions:
      contents: read

  agent-certificate-conformance:
    name: Verify agent certificate rotation
    uses: ./.github/workflows/agent-certificate-conformance.yml
    permissions:
      contents: read

  ai-audit-conformance:
    name: Verify AI audit lifecycle
    uses: ./.github/workflows/ai-audit-conformance.yml
    permissions:
      contents: read

  notification-conformance:
    name: Verify notification providers
    uses: ./.github/workflows/notification-conformance.yml
    permissions:
      contents: read

  migration-conformance:
    name: Verify Dokploy migration
    uses: ./.github/workflows/migration-conformance.yml
    permissions:
      contents: read

  upgrade-conformance:
    name: Verify previous release upgrade
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve previous immutable release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$CURRENT_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "release version must be a v-prefixed SemVer value" >&2
            exit 1
          fi
          releases="$(gh api --paginate --slurp "/repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq 'add')"
          published_count="$(jq '[.[] | select(.draft == false and .prerelease == false)] | length' <<<"$releases")"
          previous="$(jq -c --arg current "$CURRENT_VERSION" \
            '[.[] | select(.draft == false and .prerelease == false and .tag_name != $current and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))] | sort_by(.published_at) | reverse | .[0] // empty' \
            <<<"$releases")"
          if [ -z "$previous" ]; then
            if [ "$published_count" -ne 0 ]; then
              echo "published releases exist but none is an eligible previous stable release" >&2
              exit 1
            fi
            echo "first_release=true" >>"$GITHUB_OUTPUT"
            jq -n --arg createdAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg sourceCommit "$GITHUB_SHA" \
              '{status:"not_applicable",firstRelease:true,reason:"no previous published release",sourceCommit:$sourceCommit,createdAt:$createdAt}' \
              >upgrade-conformance.json
            exit 0
          fi
          release_id="$(jq -r .id <<<"$previous")"
          previous_version="$(jq -r .tag_name <<<"$previous")"
          asset_id="$(gh api "/repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
            --jq '.[] | select(.name == "promotion-manifest.json") | .id' | head -1)"
          test -n "$asset_id" || { echo "previous release $previous_version has no promotion manifest" >&2; exit 1; }
          gh api "/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
            --header 'Accept: application/octet-stream' >previous-promotion-manifest.json
          previous_image="$(jq -er --arg version "$previous_version" \
            'select(.version == $version and (.sourceCommit | test("^[a-f0-9]{40}$"))) | .image | select(test("^ghcr\\.io/.+@sha256:[a-f0-9]{64}$"))' \
            previous-promotion-manifest.json)"
          newest="$(printf '%s\n%s\n' "$previous_version" "$CURRENT_VERSION" | sort --version-sort | tail -1)"
          if [ "$newest" != "$CURRENT_VERSION" ] || [ "$previous_version" = "$CURRENT_VERSION" ]; then
            echo "release $CURRENT_VERSION must be newer than previous release $previous_version" >&2
            exit 1
          fi
          {
            echo "first_release=false"
            echo "image=$previous_image"
            echo "version=$previous_version"
          } >>"$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
        if: steps.previous.outputs.first_release == 'false'

      - name: Verify previous release signature
        if: steps.previous.outputs.first_release == 'false'
        env:
          PREVIOUS_IMAGE: ${{ steps.previous.outputs.image }}
        run: |
          set -euo pipefail
          identity="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/(heads|tags)/.+$"
          cosign verify \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$PREVIOUS_IMAGE"

      - name: Build upgrade candidate
        if: steps.previous.outputs.first_release == 'false'
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: docker build --build-arg "VERSION=$RELEASE_VERSION" --tag dockyard:upgrade-candidate .

      - name: Exercise persisted-state upgrade
        if: steps.previous.outputs.first_release == 'false'
        env:
          DOCKYARD_PREVIOUS_IMAGE: ${{ steps.previous.outputs.image }}
          DOCKYARD_CANDIDATE_IMAGE: dockyard:upgrade-candidate
          DOCKYARD_UPGRADE_EVIDENCE: upgrade-conformance.json
          DOCKYARD_UPGRADE_POSTGRES_IMAGE: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        run: scripts/ci/test-release-upgrade.sh

      - name: Validate upgrade evidence
        run: |
          jq -e --arg sourceCommit "$GITHUB_SHA" '
            .sourceCommit == $sourceCommit and
            ((.status == "passed" and .migrations.checksumsVerified and .authenticationVerified and .encryptedSecretsVerified and .resourceCountsVerified and .queueRecoveryVerified and .existingStackReconciliationVerified)
            or (.status == "not_applicable" and .firstRelease == true and .reason == "no previous published release"))
          ' upgrade-conformance.json >/dev/null

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upgrade-conformance
          path: upgrade-conformance.json
          if-no-files-found: error

  publish:
    needs: [verify, database-recovery, sso-conformance, swarm-ha-conformance, lifecycle-conformance, reconciliation-conformance, agent-certificate-conformance, ai-audit-conformance, notification-conformance, migration-conformance, upgrade-conformance]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Resolve immutable release coordinates
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$REQUESTED_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "release version must be a v-prefixed SemVer value" >&2
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$REQUESTED_VERSION" >/dev/null; then
            tagged_commit="$(git rev-list -n 1 "$REQUESTED_VERSION")"
            if [ "$tagged_commit" != "$GITHUB_SHA" ]; then
              echo "release tag $REQUESTED_VERSION already points to $tagged_commit, not $GITHUB_SHA" >&2
              exit 1
            fi
          fi
          if gh release view "$REQUESTED_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $REQUESTED_VERSION is already published and cannot be overwritten" >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf 'version=%s\n' "$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-architecture image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # The public version tag is assigned only after scans, signature
          # verification, soak, and evidence aggregation have all passed.
          tags: ${{ steps.release.outputs.image }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: VERSION=${{ steps.release.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve promoted platform digests
        id: platforms
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" > image-index.json
          amd64_digest="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' image-index.json)"
          arm64_digest="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' image-index.json)"
          platform_count="$(jq -r '[.manifests[] | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64"))] | length' image-index.json)"
          test "$platform_count" -eq 2
          printf 'amd64=%s@%s\n' "$IMAGE" "$amd64_digest" >> "$GITHUB_OUTPUT"
          printf 'arm64=%s@%s\n' "$IMAGE" "$arm64_digest" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg imageIndex "$IMAGE@$DIGEST" \
            --arg amd64 "$IMAGE@$amd64_digest" \
            --arg arm64 "$IMAGE@$arm64_digest" \
            --arg sourceCommit "$GITHUB_SHA" \
            '{imageIndex:$imageIndex,sourceCommit:$sourceCommit,platforms:{"linux/amd64":$amd64,"linux/arm64":$arm64}}' \
            > image-platforms.json

      - name: Scan exact promoted amd64 image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ steps.platforms.outputs.amd64 }}
          format: json
          output: trivy-amd64.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

      - name: Scan exact promoted arm64 image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ steps.platforms.outputs.arm64 }}
          format: json
          output: trivy-arm64.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

      - name: Validate vulnerability evidence
        env:
          IMAGE_INDEX: ${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}
          AMD64_IMAGE: ${{ steps.platforms.outputs.amd64 }}
          ARM64_IMAGE: ${{ steps.platforms.outputs.arm64 }}
        run: |
          set -euo pipefail
          jq -e --arg imageIndex "$IMAGE_INDEX" --arg amd64 "$AMD64_IMAGE" --arg arm64 "$ARM64_IMAGE" --arg sourceCommit "$GITHUB_SHA" \
            '.imageIndex == $imageIndex and .sourceCommit == $sourceCommit and .platforms["linux/amd64"] == $amd64 and .platforms["linux/arm64"] == $arm64' \
            image-platforms.json >/dev/null
          jq -e '[.Results[]?.Vulnerabilities[]?] | length == 0' trivy-amd64.json >/dev/null
          jq -e '[.Results[]?.Vulnerabilities[]?] | length == 0' trivy-arm64.json >/dev/null

      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: Sign and verify immutable digest
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          subject="$IMAGE@$DIGEST"
          identity="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/(heads|tags)/.+$"
          issuer="https://token.actions.githubusercontent.com"
          cosign sign --yes "$subject"
          cosign verify --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" "$subject"
          cosign verify-attestation --type slsaprovenance --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" "$subject"
          cosign verify-attestation --type spdxjson --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" "$subject"

      - name: Exercise exact image named-volume recovery
        env:
          DOCKYARD_TEST_VOLUME_HELPER_IMAGE: ${{ steps.platforms.outputs.amd64 }}
          DOCKYARD_VOLUME_RECOVERY_EVIDENCE: ${{ github.workspace }}/volume-recovery-conformance.json
        run: |
          set -euo pipefail
          DOCKYARD_TEST_VOLUME_RECOVERY=1 go test -timeout 15m -run TestNamedVolumeRecoveryConformance -v -count=1 ./internal/deploy | tee volume-recovery-conformance.log
          jq -e --arg image "$DOCKYARD_TEST_VOLUME_HELPER_IMAGE" --arg sourceCommit "$GITHUB_SHA" '
            .status == "passed" and .image == $image and .sourceCommit == $sourceCommit and
            .artifactBytes > 0 and .backupSeconds >= 0 and .rtoSeconds >= 0 and
            .backupQuiesced and .restoreQuiesced and .encryptedArtifactVerified and
            .corruptionReplaced and .permissionsVerified and .symlinkVerified and
            .workloadResumed and .restartVerified
          ' volume-recovery-conformance.json >/dev/null

      - name: Soak signed release and verify automatic rollback
        env:
          DOCKYARD_IMAGE: ${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}
          DOCKYARD_RELEASE_SOAK_SECONDS: ${{ vars.DOCKYARD_RELEASE_SOAK_SECONDS || '300' }}
          DOCKYARD_SOAK_EVIDENCE: release-soak-evidence.json
        run: scripts/ci/test-release-soak.sh

      - name: Validate release soak evidence
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          jq -e --arg image "$RELEASE_IMAGE" --arg sourceCommit "$GITHUB_SHA" '
            .image == $image and .sourceCommit == $sourceCommit and .status == "passed" and
            .configuredSoakSeconds >= 60 and .healthChecks >= 1 and .healthVerified and
            .readinessVerified and .authenticationVerified and .metricsVerified and
            .replicaConvergenceVerified and .failedHealthCheckInjected and
            .automaticRollbackVerified and .originalHealthcheckRestored and
            .rollbackState == "rollback_completed"
          ' release-soak-evidence.json >/dev/null

      - name: Export promoted image SPDX SBOM
        uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1
        with:
          image: ${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Download database recovery evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: recovery-*
          path: recovery-evidence

      - name: Download SSO and Swarm HA evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "*-conformance"
          path: conformance-evidence
          merge-multiple: true

      - name: Download upgrade evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: upgrade-conformance
          path: upgrade-evidence

      - name: Aggregate database recovery evidence
        run: |
          set -euo pipefail
          mapfile -t evidence_files < <(find recovery-evidence -type f -name 'recovery-*.json' -print | sort)
          test "${#evidence_files[@]}" -eq 10
          jq -s 'sort_by(.engine)' "${evidence_files[@]}" > database-recovery-evidence.json
          jq -e 'length == 10 and ([.[].engine] | unique | length) == 10 and all(.[]; .dataVerified == true and .restartVerified == true)' database-recovery-evidence.json >/dev/null
          cp conformance-evidence/sso-keycloak-evidence.json .
          cp conformance-evidence/swarm-ha-conformance.json .
          cp conformance-evidence/lifecycle-conformance.json .
          cp conformance-evidence/reconciliation-conformance.json .
          cp conformance-evidence/agent-certificate-conformance.json .
          cp conformance-evidence/ai-audit-conformance.json .
          cp conformance-evidence/notification-conformance.json .
          cp conformance-evidence/migration-conformance.json .
          cp upgrade-evidence/upgrade-conformance.json .
          jq -e '.oidc and .samlSpInitiated and .samlIdpInitiated and .tenantIsolation and .replayRejected' sso-keycloak-evidence.json >/dev/null
          jq -e '.minorityMutationRejected and .replicasConverged and .managers == 3' swarm-ha-conformance.json >/dev/null
          jq -e --arg sourceCommit "$GITHUB_SHA" '.sourceCommit == $sourceCommit and .status == "passed" and .deploySucceeded and .deployFailed and .deploymentCancelled and .rollbackSucceeded and .signedWebhookAccepted and .webhookReplayRejected and .commitStatusDelivered and .failureNotificationDelivered and .workerTakeoverFenced and .staleCompletionRejected and .cancellationCompletionRace and .remoteAgentCommand' lifecycle-conformance.json >/dev/null
          jq -e --arg sourceCommit "$GITHUB_SHA" '.sourceCommit == $sourceCommit and .status == "passed" and .localMissingStackRepaired and .twoObservationThreshold and .duplicateRepairSuppressed and .immutableSnapshotPreserved and .desiredEditsPreserved and .maintenanceSuppressed and .activeDeploymentSuppressed and .remoteHeartbeatSuppressed and .remoteCapacitySuppressed and .remoteCapacityRecoveryQueued and .metricsExposed and .aiAuditSnapshotExposed' reconciliation-conformance.json >/dev/null
          jq -e --arg sourceCommit "$GITHUB_SHA" '.sourceCommit == $sourceCommit and .status == "passed" and .tlsVersion == "1.3" and .oldCertificateAuthenticated and .replacementIssuedPending and .oldValidBeforeConfirmation and .replacementPromotedOnHeartbeat and .oldRejectedAfterPromotion and .wrongClusterRejected and .untrustedCARejected and .expiredCertificateRejected and .mismatchedKeyRejected and .pendingMetricsConverged and .invalidReplacementPreservesIdentity' agent-certificate-conformance.json >/dev/null
          jq -e --arg sourceCommit "$GITHUB_SHA" '.sourceCommit == $sourceCommit and .status == "passed" and .realPlatformAPI and .openAICompatibleGateway and .snapshotSecretsRedacted and .promptInjectionBoundaryPresent and .deterministicFindingsPersisted and .modelFindingsPersisted and .durableRunCompleted and .lifecycleAudited and .auditorLeastPrivilege' ai-audit-conformance.json >/dev/null
          jq -e --arg sourceCommit "$GITHUB_SHA" '.sourceCommit == $sourceCommit and .status == "passed" and .durableWorkerPath and .signedWebhook and .slackCompatible and .pagerDuty and .opsgenie and .authenticatedImplicitTLSSMTP and .retryRecovered and .tenantIsolation and .deduplicated and .secretsEncrypted and .deliveries == 5 and .jobAttempts == 6' notification-conformance.json >/dev/null
          jq -e --arg sourceCommit "$GITHUB_SHA" '.sourceCommit == $sourceCommit and .status == "passed" and .postgresBacked and .dryRunSecretSafe and .controlPlaneImported and .idempotentImport and .composeImported and .applicationsImported and .routesImported and .databasesImported == 6 and .backupConfigurationImported and .sourceCredentialsReencrypted and .notificationsReencrypted and .databaseTransfersQueued == 6 and .transferSecretsEncrypted and .tenantOwnershipEnforced and .manualAcknowledgementsExplicit and .operationalVerifierFailClosed' migration-conformance.json >/dev/null
          jq -e --arg sourceCommit "$GITHUB_SHA" '.sourceCommit == $sourceCommit and (.status == "passed" or (.status == "not_applicable" and .firstRelease == true))' upgrade-conformance.json >/dev/null

      - name: Write promotion manifest
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          schema_version="$(find internal/store/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort | tail -1 | cut -d_ -f1)"
          test -n "$schema_version"
          jq -n \
            --arg version "$VERSION" \
            --arg image "$IMAGE@$DIGEST" \
            --arg sourceCommit "$GITHUB_SHA" \
            --arg schemaVersion "$schema_version" \
            --arg operator "$GITHUB_ACTOR" \
            --arg workflowRun "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg createdAt "$created_at" \
            '{version:$version,image:$image,sourceCommit:$sourceCommit,schemaVersion:$schemaVersion,operator:$operator,workflowRun:$workflowRun,createdAt:$createdAt,signature:"sigstore-keyless",provenance:"slsa",sbom:"spdx-json",platformEvidence:"image-platforms.json",amd64VulnerabilityEvidence:"trivy-amd64.json",arm64VulnerabilityEvidence:"trivy-arm64.json",databaseRecoveryEvidence:"database-recovery-evidence.json",volumeRecoveryEvidence:"volume-recovery-conformance.json",ssoConformanceEvidence:"sso-keycloak-evidence.json",swarmHAEvidence:"swarm-ha-conformance.json",lifecycleConformanceEvidence:"lifecycle-conformance.json",reconciliationConformanceEvidence:"reconciliation-conformance.json",agentCertificateConformanceEvidence:"agent-certificate-conformance.json",aiAuditConformanceEvidence:"ai-audit-conformance.json",notificationConformanceEvidence:"notification-conformance.json",migrationConformanceEvidence:"migration-conformance.json",upgradeConformanceEvidence:"upgrade-conformance.json",releaseSoakEvidence:"release-soak-evidence.json"}' \
            > promotion-manifest.json
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > image-digest.txt
          cat promotion-manifest.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: promotion-${{ steps.release.outputs.version }}
          path: |
            promotion-manifest.json
            image-digest.txt
            image-platforms.json
            trivy-amd64.json
            trivy-arm64.json
            sbom.spdx.json
            database-recovery-evidence.json
            volume-recovery-conformance.json
            volume-recovery-conformance.log
            sso-keycloak-evidence.json
            swarm-ha-conformance.json
            lifecycle-conformance.json
            reconciliation-conformance.json
            agent-certificate-conformance.json
            ai-audit-conformance.json
            notification-conformance.json
            migration-conformance.json
            upgrade-conformance.json
            release-soak-evidence.json
          if-no-files-found: error

      - name: Assign verified digest to release tag
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "release image tag $IMAGE:$VERSION already exists and cannot be overwritten" >&2
            exit 1
          fi
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE@$DIGEST"
          docker buildx imagetools inspect --raw "$IMAGE:$VERSION" > version-image-index.json
          resolved_digest="sha256:$(sha256sum version-image-index.json | cut -d ' ' -f1)"
          if [ "$resolved_digest" != "$DIGEST" ]; then
            echo "release tag resolved to $resolved_digest instead of verified digest $DIGEST" >&2
            exit 1
          fi

      - name: Publish package for anonymous pulls
        env:
          GH_TOKEN: ${{ secrets.GHCR_ADMIN_TOKEN || github.token }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ github.event.repository.name }}
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          owner_type="$(gh api "/users/$OWNER" --jq .type)"
          case "$owner_type" in
            Organization) endpoint="/orgs/$OWNER/packages/container/$PACKAGE" ;;
            User) endpoint="/users/$OWNER/packages/container/$PACKAGE" ;;
            *) echo "unsupported GitHub repository owner type: $owner_type" >&2; exit 1 ;;
          esac
          if ! gh api --method PATCH "$endpoint" -f visibility=public >/dev/null; then
            echo "could not make $IMAGE public; configure the GHCR_ADMIN_TOKEN repository secret with package administration rights" >&2
            exit 1
          fi
          repository="${IMAGE#ghcr.io/}"
          for _ in {1..12}; do
            token="$(curl --fail --silent --show-error --get \
              --data-urlencode "scope=repository:$repository:pull" \
              'https://ghcr.io/token' | jq -er .token 2>/dev/null || true)"
            if [ -n "$token" ] && curl --fail --silent --show-error --output /dev/null \
              --header "Authorization: Bearer $token" \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://ghcr.io/v2/$repository/manifests/$VERSION"; then
              exit 0
            fi
            sleep 5
          done
          echo "$IMAGE:$VERSION is not anonymously pullable after publication" >&2
          exit 1

      - name: Publish immutable release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          assets=(promotion-manifest.json image-digest.txt image-platforms.json trivy-amd64.json trivy-arm64.json sbom.spdx.json database-recovery-evidence.json volume-recovery-conformance.json volume-recovery-conformance.log sso-keycloak-evidence.json swarm-ha-conformance.json lifecycle-conformance.json reconciliation-conformance.json agent-certificate-conformance.json ai-audit-conformance.json notification-conformance.json migration-conformance.json upgrade-conformance.json release-soak-evidence.json)
          gh release create "$VERSION" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Dockyard $VERSION" \
            --generate-notes
