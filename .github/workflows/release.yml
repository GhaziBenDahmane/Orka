name: Release image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: SemVer release tag, including the leading v
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  database-recovery:
    name: Verify database recovery
    uses: ./.github/workflows/database-recovery.yml
    permissions:
      contents: read

  sso-conformance:
    name: Verify SSO conformance
    uses: ./.github/workflows/sso-conformance.yml
    permissions:
      contents: read

  swarm-ha-conformance:
    name: Verify Swarm HA conformance
    uses: ./.github/workflows/swarm-ha-conformance.yml
    permissions:
      contents: read

  lifecycle-conformance:
    name: Verify deployment lifecycle
    uses: ./.github/workflows/lifecycle-conformance.yml
    permissions:
      contents: read

  reconciliation-conformance:
    name: Verify drift reconciliation
    uses: ./.github/workflows/reconciliation-conformance.yml
    permissions:
      contents: read

  agent-certificate-conformance:
    name: Verify agent certificate rotation
    uses: ./.github/workflows/agent-certificate-conformance.yml
    permissions:
      contents: read

  ai-audit-conformance:
    name: Verify AI audit lifecycle
    uses: ./.github/workflows/ai-audit-conformance.yml
    permissions:
      contents: read

  notification-conformance:
    name: Verify notification providers
    uses: ./.github/workflows/notification-conformance.yml
    permissions:
      contents: read

  migration-conformance:
    name: Verify Dokploy migration
    uses: ./.github/workflows/migration-conformance.yml
    permissions:
      contents: read

  upgrade-conformance:
    name: Verify previous release upgrade
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Resolve previous immutable release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$CURRENT_VERSION" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "release version must be a stable v-prefixed SemVer value without leading zeroes" >&2
            exit 1
          fi
          releases="$(gh api --paginate --slurp "/repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq 'add')"
          stable_releases="$(jq '[.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$")))]' <<<"$releases")"
          previous_version="$(jq -r '.[].tag_name' <<<"$stable_releases" | sort --version-sort | tail -1)"
          if [ -z "$previous_version" ]; then
            echo "first_release=true" >>"$GITHUB_OUTPUT"
            jq -n --arg createdAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg sourceCommit "$GITHUB_SHA" \
              '{status:"not_applicable",firstRelease:true,reason:"no previous published release",sourceCommit:$sourceCommit,createdAt:$createdAt}' \
              >upgrade-conformance.json
            exit 0
          fi
          newest="$(printf '%s\n%s\n' "$previous_version" "$CURRENT_VERSION" | sort --version-sort | tail -1)"
          if [ "$newest" != "$CURRENT_VERSION" ] || [ "$previous_version" = "$CURRENT_VERSION" ]; then
            echo "release $CURRENT_VERSION must be newer than highest stable release $previous_version" >&2
            exit 1
          fi
          previous="$(jq -c --arg version "$previous_version" '.[] | select(.tag_name == $version)' <<<"$stable_releases")"
          test "$(wc -l <<<"$previous")" -eq 1 || { echo "stable release $previous_version is ambiguous" >&2; exit 1; }
          release_id="$(jq -r .id <<<"$previous")"
          asset_id="$(gh api "/repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
            --jq '.[] | select(.name == "promotion-manifest.json") | .id' | head -1)"
          bundle_asset_id="$(gh api "/repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
            --jq '.[] | select(.name == "promotion-manifest.sigstore.json") | .id' | head -1)"
          certification_asset_id="$(gh api "/repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
            --jq '.[] | select(.name == "production-certification.json") | .id' | head -1)"
          certification_bundle_asset_id="$(gh api "/repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
            --jq '.[] | select(.name == "production-certification.sigstore.json") | .id' | head -1)"
          test -n "$asset_id" || { echo "previous release $previous_version has no promotion manifest" >&2; exit 1; }
          test -n "$bundle_asset_id" || { echo "previous release $previous_version has no signed promotion-manifest bundle" >&2; exit 1; }
          test -n "$certification_asset_id" || { echo "previous release $previous_version has no production certification" >&2; exit 1; }
          test -n "$certification_bundle_asset_id" || { echo "previous release $previous_version has no signed production-certification bundle" >&2; exit 1; }
          gh api "/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
            --header 'Accept: application/octet-stream' >previous-promotion-manifest.json
          gh api "/repos/$GITHUB_REPOSITORY/releases/assets/$bundle_asset_id" \
            --header 'Accept: application/octet-stream' >previous-promotion-manifest.sigstore.json
          gh api "/repos/$GITHUB_REPOSITORY/releases/assets/$certification_asset_id" \
            --header 'Accept: application/octet-stream' >previous-production-certification.json
          gh api "/repos/$GITHUB_REPOSITORY/releases/assets/$certification_bundle_asset_id" \
            --header 'Accept: application/octet-stream' >previous-production-certification.sigstore.json
          {
            echo "first_release=false"
            echo "version=$previous_version"
          } >>"$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
        if: steps.previous.outputs.first_release == 'false'

      - name: Verify previous release evidence signature
        id: previous_verified
        if: steps.previous.outputs.first_release == 'false'
        env:
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}
        run: |
          set -euo pipefail
          identity="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/(heads|tags)/.+$"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify-blob \
            --bundle previous-promotion-manifest.sigstore.json \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer "$issuer" \
            previous-promotion-manifest.json
          previous_commit="$(git rev-list -n 1 "$PREVIOUS_VERSION")"
          image_repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          previous_image="$(jq -er \
            --arg version "$PREVIOUS_VERSION" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sourceCommit "$previous_commit" \
            --arg imageRepository "$image_repository" \
            'select(.version == $version and .repository == $repository and .sourceCommit == $sourceCommit and .evidenceChecksums == "release-evidence.sha256" and (.evidenceChecksumsSHA256 | test("^[a-f0-9]{64}$")) and .manifestSignature == "sigstore-keyless-bundle" and .productionCertification == "production-certification.json" and .productionCertificationSignatureBundle == "production-certification.sigstore.json") | .image | select(startswith($imageRepository + "@sha256:") and test("@sha256:[a-f0-9]{64}$"))' \
            previous-promotion-manifest.json)"
          certification_identity="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/production-certification.yml@refs/(heads|tags)/.+$"
          cosign verify-blob \
            --bundle previous-production-certification.sigstore.json \
            --certificate-identity-regexp "$certification_identity" \
            --certificate-oidc-issuer "$issuer" \
            previous-production-certification.json
          manifest_created_at="$(jq -er '.createdAt | select(type == "string")' previous-promotion-manifest.json)"
          go run ./cmd/dockyard validate-production-certification \
            --file previous-production-certification.json \
            --source-commit "$previous_commit" \
            --candidate-image "$previous_image" \
            --at "$manifest_created_at" \
            >/dev/null
          printf 'image=%s\n' "$previous_image" >>"$GITHUB_OUTPUT"

      - name: Verify previous release image signature
        if: steps.previous.outputs.first_release == 'false'
        env:
          PREVIOUS_IMAGE: ${{ steps.previous_verified.outputs.image }}
        run: |
          set -euo pipefail
          identity="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/(heads|tags)/.+$"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer "$issuer" \
            "$PREVIOUS_IMAGE"

      - name: Build upgrade candidate
        if: steps.previous.outputs.first_release == 'false'
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: docker build --build-arg "VERSION=$RELEASE_VERSION" --tag dockyard:upgrade-candidate .

      - name: Exercise persisted-state upgrade
        if: steps.previous.outputs.first_release == 'false'
        env:
          DOCKYARD_PREVIOUS_IMAGE: ${{ steps.previous_verified.outputs.image }}
          DOCKYARD_CANDIDATE_IMAGE: dockyard:upgrade-candidate
          DOCKYARD_UPGRADE_EVIDENCE: upgrade-conformance.json
          DOCKYARD_UPGRADE_POSTGRES_IMAGE: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        run: scripts/ci/test-release-upgrade.sh

      - name: Validate upgrade evidence
        run: |
          jq -e --arg sourceCommit "$GITHUB_SHA" '
            .sourceCommit == $sourceCommit and
            ((.status == "passed" and .migrations.checksumsVerified and .authenticationVerified and .encryptedSecretsVerified and .resourceCountsVerified and .queueRecoveryVerified and .existingStackReconciliationVerified)
            or (.status == "not_applicable" and .firstRelease == true and .reason == "no previous published release"))
          ' upgrade-conformance.json >/dev/null

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upgrade-conformance
          path: upgrade-conformance.json
          if-no-files-found: error

  candidate:
    needs: [verify, database-recovery, sso-conformance, swarm-ha-conformance, lifecycle-conformance, reconciliation-conformance, agent-certificate-conformance, ai-audit-conformance, notification-conformance, migration-conformance, upgrade-conformance]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.release.outputs.version }}
      image: ${{ steps.release.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dockyard
          POSTGRES_PASSWORD: dockyard
          POSTGRES_DB: dockyard_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dockyard -d dockyard_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DOCKYARD_TEST_DATABASE_URL: postgres://dockyard:dockyard@127.0.0.1:5432/dockyard_release?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Resolve immutable release coordinates
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$REQUESTED_VERSION" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "release version must be a stable v-prefixed SemVer value without leading zeroes" >&2
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$REQUESTED_VERSION" >/dev/null; then
            tagged_commit="$(git rev-list -n 1 "$REQUESTED_VERSION")"
            if [ "$tagged_commit" != "$GITHUB_SHA" ]; then
              echo "release tag $REQUESTED_VERSION already points to $tagged_commit, not $GITHUB_SHA" >&2
              exit 1
            fi
          fi
          if gh release view "$REQUESTED_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $REQUESTED_VERSION is already published and cannot be overwritten" >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf 'version=%s\n' "$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-architecture image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # The public version tag is assigned only after scans, signature
          # verification, soak, and evidence aggregation have all passed.
          tags: ${{ steps.release.outputs.image }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: VERSION=${{ steps.release.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve promoted platform digests
        id: platforms
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" > image-index.json
          amd64_digest="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' image-index.json)"
          arm64_digest="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' image-index.json)"
          platform_count="$(jq -r '[.manifests[] | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64"))] | length' image-index.json)"
          test "$platform_count" -eq 2
          printf 'amd64=%s@%s\n' "$IMAGE" "$amd64_digest" >> "$GITHUB_OUTPUT"
          printf 'arm64=%s@%s\n' "$IMAGE" "$arm64_digest" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg imageIndex "$IMAGE@$DIGEST" \
            --arg amd64 "$IMAGE@$amd64_digest" \
            --arg arm64 "$IMAGE@$arm64_digest" \
            --arg sourceCommit "$GITHUB_SHA" \
            '{imageIndex:$imageIndex,sourceCommit:$sourceCommit,platforms:{"linux/amd64":$amd64,"linux/arm64":$arm64}}' \
            > image-platforms.json

      - name: Scan exact promoted amd64 image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ steps.platforms.outputs.amd64 }}
          format: json
          output: trivy-amd64.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

      - name: Scan exact promoted arm64 image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ steps.platforms.outputs.arm64 }}
          format: json
          output: trivy-arm64.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

      - name: Validate vulnerability evidence
        env:
          IMAGE_INDEX: ${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}
          AMD64_IMAGE: ${{ steps.platforms.outputs.amd64 }}
          ARM64_IMAGE: ${{ steps.platforms.outputs.arm64 }}
        run: |
          set -euo pipefail
          jq -e --arg imageIndex "$IMAGE_INDEX" --arg amd64 "$AMD64_IMAGE" --arg arm64 "$ARM64_IMAGE" --arg sourceCommit "$GITHUB_SHA" \
            '.imageIndex == $imageIndex and .sourceCommit == $sourceCommit and .platforms["linux/amd64"] == $amd64 and .platforms["linux/arm64"] == $arm64' \
            image-platforms.json >/dev/null
          jq -e '[.Results[]?.Vulnerabilities[]?] | length == 0' trivy-amd64.json >/dev/null
          jq -e '[.Results[]?.Vulnerabilities[]?] | length == 0' trivy-arm64.json >/dev/null

      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: Sign and verify immutable digest
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          subject="$IMAGE@$DIGEST"
          identity="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/(heads|tags)/.+$"
          issuer="https://token.actions.githubusercontent.com"
          cosign sign --yes "$subject"
          cosign verify --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" "$subject"
          cosign verify-attestation --type slsaprovenance --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" "$subject"
          cosign verify-attestation --type spdxjson --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" "$subject"

      - name: Exercise exact image named-volume recovery
        env:
          DOCKYARD_TEST_VOLUME_HELPER_IMAGE: ${{ steps.platforms.outputs.amd64 }}
          DOCKYARD_VOLUME_RECOVERY_EVIDENCE: ${{ github.workspace }}/volume-recovery-conformance.json
        run: |
          set -euo pipefail
          DOCKYARD_TEST_VOLUME_RECOVERY=1 go test -timeout 15m -run TestNamedVolumeRecoveryConformance -v -count=1 ./internal/deploy | tee volume-recovery-conformance.log
          jq -e --arg image "$DOCKYARD_TEST_VOLUME_HELPER_IMAGE" --arg sourceCommit "$GITHUB_SHA" '
            .status == "passed" and .image == $image and .sourceCommit == $sourceCommit and
            .artifactBytes > 0 and .backupSeconds >= 0 and .rtoSeconds >= 0 and .offlineRestoreSeconds >= 0 and
            (.backupNodeId | test("^[a-z0-9]{1,64}$")) and (.offlineRestoreNodeId | test("^[a-z0-9]{1,64}$")) and
            .backupQuiesced and .restoreQuiesced and .encryptedArtifactVerified and
            .offlineWorkloadAbsent and .offlineRestoreVerified and .offlineStartVerified and
            .corruptionReplaced and .permissionsVerified and .symlinkVerified and
            .workloadResumed and .restartVerified and .retentionRestoreProtected
          ' volume-recovery-conformance.json >/dev/null

      - name: Soak signed release and verify automatic rollback
        env:
          DOCKYARD_IMAGE: ${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}
          DOCKYARD_RELEASE_SOAK_SECONDS: ${{ vars.DOCKYARD_RELEASE_SOAK_SECONDS || '300' }}
          DOCKYARD_SOAK_EVIDENCE: release-soak-evidence.json
        run: scripts/ci/test-release-soak.sh

      - name: Validate release soak evidence
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          jq -e --arg image "$RELEASE_IMAGE" --arg sourceCommit "$GITHUB_SHA" '
            .image == $image and .sourceCommit == $sourceCommit and .status == "passed" and
            .configuredSoakSeconds >= 60 and .observedSoakSeconds >= .configuredSoakSeconds and .healthChecks >= 1 and .healthVerified and
            .readinessVerified and .authenticationVerified and .metricsVerified and
            .replicaConvergenceVerified and .failedHealthCheckInjected and
            .automaticRollbackVerified and .originalHealthcheckRestored and .imageIdentityRestored and .failedTaskIsolated and
            (.observations.baselineImageId | test("^sha256:[a-f0-9]{64}$")) and
            .observations.recoveredImageId == .observations.baselineImageId and
            .observations.baselineTaskId != .observations.injectedTaskId and
            .observations.recoveredTaskId != .observations.injectedTaskId and
            (.observations.injectedTaskState == "complete" or .observations.injectedTaskState == "failed" or .observations.injectedTaskState == "shutdown") and .observations.injectedTaskDesiredState == "shutdown" and
            .observations.injectedServiceVersion > .observations.baselineServiceVersion and
            .observations.rollbackServiceVersion > .observations.injectedServiceVersion and
            .rollbackState == "rollback_completed"
          ' release-soak-evidence.json >/dev/null

      - name: Export promoted image SPDX SBOM
        uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1
        with:
          image: ${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Download database recovery evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: recovery-*
          path: recovery-evidence

      - name: Download SSO and Swarm HA evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "*-conformance"
          path: conformance-evidence
          merge-multiple: true

      - name: Download upgrade evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: upgrade-conformance
          path: upgrade-evidence

      - name: Aggregate database recovery evidence
        run: |
          set -euo pipefail
          mapfile -t evidence_files < <(find recovery-evidence -type f -name 'recovery-*.json' -print | sort)
          test "${#evidence_files[@]}" -eq 10
          jq -s 'sort_by(.engine)' "${evidence_files[@]}" > database-recovery-evidence.json
          jq -e --arg sourceCommit "$GITHUB_SHA" 'length == 10 and ([.[].engine] | unique | length) == 10 and all(.[]; .status == "passed" and .sourceCommit == $sourceCommit and .dataVerified == true and .restartVerified == true and .replacementVerified == true and .persistentVolumeVerified == true and .imageIdentityVerified == true and .replacementImageId == .serverImage.id and all(.serverImage,.backupImage,.restoreImage; (.id | test("^sha256:[a-f0-9]{64}$")) and (.digest | test("@sha256:[a-f0-9]{64}$"))) and .artifactBytes > 0 and .rpoSeconds >= 0 and .rtoSeconds >= 0)' database-recovery-evidence.json >/dev/null
          cp conformance-evidence/sso-keycloak-evidence.json .
          cp conformance-evidence/swarm-ha-conformance.json .
          cp conformance-evidence/lifecycle-conformance.json .
          cp conformance-evidence/reconciliation-conformance.json .
          cp conformance-evidence/agent-certificate-conformance.json .
          cp conformance-evidence/ai-audit-conformance.json .
          cp conformance-evidence/notification-conformance.json .
          cp conformance-evidence/migration-conformance.json .
          cp conformance-evidence/template-conformance.json .
          cp conformance-evidence/template-conformance.log .
          cp upgrade-evidence/upgrade-conformance.json .
          jq -e --arg sourceCommit "$GITHUB_SHA" '.sourceCommit == $sourceCommit and .oidc and .samlSpInitiated and .samlIdpInitiated and .tenantIsolation and .replayRejected' sso-keycloak-evidence.json >/dev/null
          jq -e --arg sourceCommit "$GITHUB_SHA" '.status == "passed" and .sourceCommit == $sourceCommit and (.dindImage | test("@sha256:[a-f0-9]{64}$")) and (.probeImage | test("@sha256:[a-f0-9]{64}$")) and .managers == 3 and .replicas == 3 and .leaderChanged and .failedManagerObserved and .failedManagerRecovered and .workloadTaskReplaced and .workloadAvailableAfterFailover and .minorityMutationRejected and .quorumMutationCommitted and .replicasConverged and .observations.initialLeader != .observations.replacementLeader and .observations.initialReplicas == "3/3" and .observations.rejoinedReplicas == "3/3" and .observations.recoveredReplicas == "3/3" and (.observations.initialTaskIds | length) == 3 and (.observations.failoverTaskIds | length) == 3 and .observations.failoverActiveTaskCount == 3 and .observations.failoverFailedNodeTaskCount == 0 and .observations.minorityUpdateExit == 137 and .observations.minorityVersionBefore == .observations.minorityVersionAfter and .observations.minorityLabelAfterRecovery == "" and .observations.quorumVersion > .observations.minorityVersionAfter and .observations.quorumRestoredLabel == "true" and .leaderFailoverSeconds >= 0 and .quorumRecoverySeconds >= 0' swarm-ha-conformance.json >/dev/null
          jq -er '.dindImage,.probeImage' swarm-ha-conformance.json | while IFS= read -r image; do
            scripts/ci/validate-image-reference.sh "$image"
          done
          jq -e --arg sourceCommit "$GITHUB_SHA" '.sourceCommit == $sourceCommit and .status == "passed" and .deploySucceeded and .deployFailed and .deploymentCancelled and .rollbackSucceeded and .resolvedImageSnapshot and .signedWebhookAccepted and .webhookReplayRejected and .commitStatusDelivered and .failureNotificationDelivered and .workerTakeoverFenced and .staleCompletionRejected and .cancellationCompletionRace and .remoteAgentCommand' lifecycle-conformance.json >/dev/null
          jq -e --arg sourceCommit "$GITHUB_SHA" '.sourceCommit == $sourceCommit and .status == "passed" and .localMissingStackRepaired and .twoObservationThreshold and .duplicateRepairSuppressed and .immutableSnapshotPreserved and .desiredEditsPreserved and .maintenanceSuppressed and .activeDeploymentSuppressed and .remoteHeartbeatSuppressed and .remoteCapacitySuppressed and .remoteCapacityRecoveryQueued and .metricsExposed and .aiAuditSnapshotExposed' reconciliation-conformance.json >/dev/null
          jq -e --arg sourceCommit "$GITHUB_SHA" '.sourceCommit == $sourceCommit and .status == "passed" and .tlsVersion == "1.3" and .oldCertificateAuthenticated and .replacementIssuedPending and .oldValidBeforeConfirmation and .replacementPromotedOnHeartbeat and .oldRejectedAfterPromotion and .wrongClusterRejected and .untrustedCARejected and .expiredCertificateRejected and .mismatchedKeyRejected and .pendingMetricsConverged and .invalidReplacementPreservesIdentity and .caDualTrustMigrationVerified and .caFingerprintConverged and .newOnlyListenerVerified and .retiredCARejected' agent-certificate-conformance.json >/dev/null
          jq -e --arg sourceCommit "$GITHUB_SHA" '.sourceCommit == $sourceCommit and .status == "passed" and .realPlatformAPI and .openAICompatibleGateway and .snapshotSecretsRedacted and .promptInjectionBoundaryPresent and .deterministicFindingsPersisted and .deployedImageProvenanceAudited and .agentCAMismatchDetected and .agentImageProvenanceAudited and .databaseAvailabilityAudited and .managedNetworkPostureAudited and .staleDeployCredentialAudited and .staleServiceAccountAudited and .customTLSValidityAudited and .edgeTLSConvergenceAudited and .offlineVolumeRecoveryAudited and .modelFindingsPersisted and .durableRunCompleted and .lifecycleAudited and .auditorLeastPrivilege and .findingTriageAudited and .findingTriageAtomic and .criticalFindingNotified and .auditorTriageDenied and .triageTenantIsolated' ai-audit-conformance.json >/dev/null
          jq -e --arg sourceCommit "$GITHUB_SHA" '.sourceCommit == $sourceCommit and .status == "passed" and .durableWorkerPath and .signedWebhook and .slackCompatible and .pagerDuty and .opsgenie and .authenticatedImplicitTLSSMTP and .retryRecovered and .tenantIsolation and .deduplicated and .secretsEncrypted and .offlineRecoveryContext and .deliveries == 6 and .jobAttempts == 7' notification-conformance.json >/dev/null
          jq -e --arg sourceCommit "$GITHUB_SHA" '.sourceCommit == $sourceCommit and .status == "passed" and .postgresBacked and .dryRunSecretSafe and .controlPlaneImported and .idempotentImport and .composeImported and .applicationsImported and .routesImported and .databasesImported == 6 and .backupConfigurationImported and .sourceCredentialsReencrypted and .notificationsReencrypted and .databaseTransfersQueued == 6 and .transferSecretsEncrypted and .tenantOwnershipEnforced and .manualAcknowledgementsExplicit and .operationalVerifierFailClosed and .databaseBackupCutoverVerified and .volumeBackupCutoverVerified' migration-conformance.json >/dev/null
          jq -e --arg sourceCommit "$GITHUB_SHA" '.sourceCommit == $sourceCommit and .status == "passed" and .productCount == 5 and ([.products[].template] | sort == ["9router","barktrace-postgres","barktrace-sqlite","postgres","redis"]) and all(.products[]; .deploymentVerified and .restartVerified and .runtimeImageIdentityVerified and .taskBefore != .taskAfter and (.runtimeImageBefore | test("^sha256:[a-f0-9]{64}$")) and .runtimeImageAfter == .runtimeImageBefore and (.image | test("@sha256:[a-f0-9]{64}$"))) and all(.products[]; .dataVerified or (.dataVerificationApplicable == false)) and all(.products[]; if .dataVerificationApplicable then .stateSeededBeforeRestart and .postRestartReadOnly else true end) and all(.products[] | select(.template == "barktrace-postgres"); .dependencyRestartVerified and .dependencyRuntimeImageIdentityVerified and .dependencyTaskBefore != .dependencyTaskAfter and (.dependencyRuntimeImageBefore | test("^sha256:[a-f0-9]{64}$")) and .dependencyRuntimeImageAfter == .dependencyRuntimeImageBefore) and all(.products[] | select(.template == "barktrace-postgres"); .dependencyImages | length == 1 and .[0].service == "postgres" and (.[0].image | test("@sha256:[a-f0-9]{64}$"))) and all(.products[] | select(.template == "barktrace-sqlite"); .sqliteFileIdentityVerified) and all(.products[].dependencyImages[]?; .image | test("@sha256:[a-f0-9]{64}$")) and (.barktraceVersion as $version | all(.products[] | select(.template | startswith("barktrace-")); .image | startswith("ghcr.io/barktrace/bark:" + $version + "@sha256:")))' template-conformance.json >/dev/null
          jq -er '.products[].image,.products[].dependencyImages[]?.image' template-conformance.json | while IFS= read -r image; do
            scripts/ci/validate-image-reference.sh "$image"
          done
          jq -e --arg sourceCommit "$GITHUB_SHA" '.sourceCommit == $sourceCommit and (.status == "passed" or (.status == "not_applicable" and .firstRelease == true))' upgrade-conformance.json >/dev/null

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-evidence-${{ steps.release.outputs.version }}
          path: |
            image-platforms.json
            trivy-amd64.json
            trivy-arm64.json
            sbom.spdx.json
            database-recovery-evidence.json
            volume-recovery-conformance.json
            volume-recovery-conformance.log
            template-conformance.json
            template-conformance.log
            sso-keycloak-evidence.json
            swarm-ha-conformance.json
            lifecycle-conformance.json
            reconciliation-conformance.json
            agent-certificate-conformance.json
            ai-audit-conformance.json
            notification-conformance.json
            migration-conformance.json
            upgrade-conformance.json
            release-soak-evidence.json
          if-no-files-found: error

      - name: Publish candidate coordinates for certification
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Production certification required"
            echo
            echo "Version: \`$VERSION\`"
            echo
            echo "Candidate: \`$IMAGE@$DIGEST\`"
            echo
            echo "Run the Production certification workflow on commit \`$GITHUB_SHA\`, then approve the protected production-release environment."
          } >>"$GITHUB_STEP_SUMMARY"

  promote:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-release
    permissions:
      actions: read
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: Download automated candidate evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-evidence-${{ needs.candidate.outputs.version }}
          path: .

      - name: Download production certification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/workflows/production-certification.yml/runs?head_sha=$GITHUB_SHA&status=success&event=workflow_dispatch&per_page=100" --slurp)"
          run_id="$(jq -er '[.[].workflow_runs[]] | sort_by(.created_at) | reverse | .[0].id' <<<"$runs")"
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "production-certification-$GITHUB_SHA" \
            --dir production-certification

      - name: Authenticate production certification and candidate evidence
        env:
          IMAGE: ${{ needs.candidate.outputs.image }}
          DIGEST: ${{ needs.candidate.outputs.digest }}
          VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          set -euo pipefail
          certification=production-certification/production-certification.json
          bundle=production-certification/production-certification.sigstore.json
          identity="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/production-certification.yml@refs/(heads|tags)/.+$"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify-blob \
            --bundle "$bundle" \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer "$issuer" \
            "$certification"
          go run ./cmd/dockyard validate-production-certification \
            --file "$certification" \
            --source-commit "$GITHUB_SHA" \
            --candidate-image "$IMAGE@$DIGEST" \
            --verify-evidence \
            >/dev/null
          release_identity="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/(heads|tags)/.+$"
          cosign verify \
            --certificate-identity-regexp "$release_identity" \
            --certificate-oidc-issuer "$issuer" \
            "$IMAGE@$DIGEST"
          cp "$certification" production-certification.json
          cp "$bundle" production-certification.sigstore.json

      - name: Write final release checksums and promotion manifest
        env:
          IMAGE: ${{ needs.candidate.outputs.image }}
          VERSION: ${{ needs.candidate.outputs.version }}
          DIGEST: ${{ needs.candidate.outputs.digest }}
        run: |
          set -euo pipefail
          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          schema_version="$(find internal/store/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort | tail -1 | cut -d_ -f1)"
          test -n "$schema_version"
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > image-digest.txt
          evidence_assets=(
            image-digest.txt image-platforms.json trivy-amd64.json trivy-arm64.json
            sbom.spdx.json database-recovery-evidence.json
            volume-recovery-conformance.json volume-recovery-conformance.log
            template-conformance.json template-conformance.log
            sso-keycloak-evidence.json swarm-ha-conformance.json
            lifecycle-conformance.json reconciliation-conformance.json
            agent-certificate-conformance.json ai-audit-conformance.json
            notification-conformance.json migration-conformance.json
            upgrade-conformance.json release-soak-evidence.json
            production-certification.json production-certification.sigstore.json
          )
          sha256sum "${evidence_assets[@]}" > release-evidence.sha256
          sha256sum --check --strict release-evidence.sha256
          evidence_checksums_sha256="$(sha256sum release-evidence.sha256 | cut -d ' ' -f1)"
          jq -n \
            --arg version "$VERSION" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg image "$IMAGE@$DIGEST" \
            --arg sourceCommit "$GITHUB_SHA" \
            --arg schemaVersion "$schema_version" \
            --arg operator "$GITHUB_ACTOR" \
            --arg workflowRun "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg createdAt "$created_at" \
            --arg evidenceChecksumsSHA256 "$evidence_checksums_sha256" \
            '{version:$version,repository:$repository,image:$image,sourceCommit:$sourceCommit,schemaVersion:$schemaVersion,operator:$operator,workflowRun:$workflowRun,createdAt:$createdAt,signature:"sigstore-keyless",manifestSignature:"sigstore-keyless-bundle",evidenceChecksums:"release-evidence.sha256",evidenceChecksumsSHA256:$evidenceChecksumsSHA256,productionCertification:"production-certification.json",productionCertificationSignatureBundle:"production-certification.sigstore.json",provenance:"slsa",sbom:"spdx-json",platformEvidence:"image-platforms.json",amd64VulnerabilityEvidence:"trivy-amd64.json",arm64VulnerabilityEvidence:"trivy-arm64.json",databaseRecoveryEvidence:"database-recovery-evidence.json",volumeRecoveryEvidence:"volume-recovery-conformance.json",templateConformanceEvidence:"template-conformance.json",ssoConformanceEvidence:"sso-keycloak-evidence.json",swarmHAEvidence:"swarm-ha-conformance.json",lifecycleConformanceEvidence:"lifecycle-conformance.json",reconciliationConformanceEvidence:"reconciliation-conformance.json",agentCertificateConformanceEvidence:"agent-certificate-conformance.json",aiAuditConformanceEvidence:"ai-audit-conformance.json",notificationConformanceEvidence:"notification-conformance.json",migrationConformanceEvidence:"migration-conformance.json",upgradeConformanceEvidence:"upgrade-conformance.json",releaseSoakEvidence:"release-soak-evidence.json"}' \
            > promotion-manifest.json
          cat promotion-manifest.json

      - name: Sign and verify promotion manifest
        run: |
          set -euo pipefail
          identity="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/(heads|tags)/.+$"
          issuer="https://token.actions.githubusercontent.com"
          cosign sign-blob --yes \
            --bundle promotion-manifest.sigstore.json \
            promotion-manifest.json
          cosign verify-blob \
            --bundle promotion-manifest.sigstore.json \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer "$issuer" \
            promotion-manifest.json
          expected_checksums_sha256="$(jq -er '.evidenceChecksumsSHA256 | select(test("^[a-f0-9]{64}$"))' promotion-manifest.json)"
          test "$(sha256sum release-evidence.sha256 | cut -d ' ' -f1)" = "$expected_checksums_sha256"
          sha256sum --check --strict release-evidence.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: promotion-${{ needs.candidate.outputs.version }}
          path: |
            promotion-manifest.json
            promotion-manifest.sigstore.json
            production-certification.json
            production-certification.sigstore.json
            release-evidence.sha256
            image-digest.txt
            image-platforms.json
            trivy-amd64.json
            trivy-arm64.json
            sbom.spdx.json
            database-recovery-evidence.json
            volume-recovery-conformance.json
            volume-recovery-conformance.log
            template-conformance.json
            template-conformance.log
            sso-keycloak-evidence.json
            swarm-ha-conformance.json
            lifecycle-conformance.json
            reconciliation-conformance.json
            agent-certificate-conformance.json
            ai-audit-conformance.json
            notification-conformance.json
            migration-conformance.json
            upgrade-conformance.json
            release-soak-evidence.json
          if-no-files-found: error

      - name: Assign verified digest to release tag
        env:
          IMAGE: ${{ needs.candidate.outputs.image }}
          VERSION: ${{ needs.candidate.outputs.version }}
          DIGEST: ${{ needs.candidate.outputs.digest }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect --raw "$IMAGE:$VERSION" > version-image-index.json 2>/dev/null; then
            existing_digest="sha256:$(sha256sum version-image-index.json | cut -d ' ' -f1)"
            if [ "$existing_digest" != "$DIGEST" ]; then
              echo "existing release image tag $IMAGE:$VERSION points to $existing_digest instead of verified digest $DIGEST" >&2
              exit 1
            fi
            echo "release image tag $IMAGE:$VERSION already points to the verified digest; resuming promotion"
          else
            docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE@$DIGEST"
            docker buildx imagetools inspect --raw "$IMAGE:$VERSION" > version-image-index.json
          fi
          resolved_digest="sha256:$(sha256sum version-image-index.json | cut -d ' ' -f1)"
          if [ "$resolved_digest" != "$DIGEST" ]; then
            echo "release tag resolved to $resolved_digest instead of verified digest $DIGEST" >&2
            exit 1
          fi

      - name: Publish package for anonymous pulls
        env:
          GH_TOKEN: ${{ secrets.GHCR_ADMIN_TOKEN || github.token }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ github.event.repository.name }}
          IMAGE: ${{ needs.candidate.outputs.image }}
          VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          set -euo pipefail
          owner_type="$(gh api "/users/$OWNER" --jq .type)"
          case "$owner_type" in
            Organization) endpoint="/orgs/$OWNER/packages/container/$PACKAGE" ;;
            User) endpoint="/users/$OWNER/packages/container/$PACKAGE" ;;
            *) echo "unsupported GitHub repository owner type: $owner_type" >&2; exit 1 ;;
          esac
          if ! gh api --method PATCH "$endpoint" -f visibility=public >/dev/null; then
            echo "could not make $IMAGE public; configure the GHCR_ADMIN_TOKEN repository secret with package administration rights" >&2
            exit 1
          fi
          repository="${IMAGE#ghcr.io/}"
          for _ in {1..12}; do
            token="$(curl --fail --silent --show-error --get \
              --data-urlencode "scope=repository:$repository:pull" \
              'https://ghcr.io/token' | jq -er .token 2>/dev/null || true)"
            if [ -n "$token" ] && curl --fail --silent --show-error --output /dev/null \
              --header "Authorization: Bearer $token" \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://ghcr.io/v2/$repository/manifests/$VERSION"; then
              exit 0
            fi
            sleep 5
          done
          echo "$IMAGE:$VERSION is not anonymously pullable after publication" >&2
          exit 1

      - name: Publish immutable release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          set -euo pipefail
          assets=(promotion-manifest.json promotion-manifest.sigstore.json production-certification.json production-certification.sigstore.json release-evidence.sha256 image-digest.txt image-platforms.json trivy-amd64.json trivy-arm64.json sbom.spdx.json database-recovery-evidence.json volume-recovery-conformance.json volume-recovery-conformance.log template-conformance.json template-conformance.log sso-keycloak-evidence.json swarm-ha-conformance.json lifecycle-conformance.json reconciliation-conformance.json agent-certificate-conformance.json ai-audit-conformance.json notification-conformance.json migration-conformance.json upgrade-conformance.json release-soak-evidence.json)
          release_json="$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName,targetCommitish,name 2>/dev/null || true)"
          if [ -n "$release_json" ]; then
            jq -e --arg version "$VERSION" --arg commit "$GITHUB_SHA" --arg title "Dockyard $VERSION" \
              '(.isDraft | type) == "boolean" and .isPrerelease == false and .tagName == $version and .targetCommitish == $commit and .name == $title' \
              <<<"$release_json" >/dev/null || {
                echo "existing release $VERSION does not match this promotion for commit $GITHUB_SHA" >&2
                exit 1
              }
            release_is_draft="$(jq -r '.isDraft' <<<"$release_json")"
          else
            gh release create "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Dockyard $VERSION" \
              --generate-notes \
              --draft
            release_is_draft=true
          fi
          if [ "$release_is_draft" = true ]; then
            gh release upload "$VERSION" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          fi
          download_dir="$(mktemp -d)"
          trap 'rm -rf "$download_dir"' EXIT
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --dir "$download_dir"
          mapfile -t published_assets < <(find "$download_dir" -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t expected_assets < <(printf '%s\n' "${assets[@]}" | sort)
          [[ "${published_assets[*]}" == "${expected_assets[*]}" ]] || {
            echo "draft release asset inventory does not match the verified promotion package" >&2
            exit 1
          }
          for asset in "${assets[@]}"; do
            cmp --silent "$asset" "$download_dir/$asset" || {
              echo "uploaded release asset $asset does not match the verified local file" >&2
              exit 1
            }
          done
          if [ "$release_is_draft" = true ]; then
            gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          else
            echo "release $VERSION is already published with the verified asset set; resuming promotion"
          fi
          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName \
            --jq '.isDraft == false and .isPrerelease == false' | grep -qx true
