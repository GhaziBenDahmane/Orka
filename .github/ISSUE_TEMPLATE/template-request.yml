name: Suggest a template
description: Propose a Docker Compose product for the built-in Orka catalog.
title: "[Template]: "
labels:
  - template
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping grow the catalog. Templates use Docker Compose and
        must be safe to run on Docker Swarm. Please link upstream documentation
        instead of including credentials or other private information.

  - type: input
    id: product
    attributes:
      label: Product name
      placeholder: "Example: BarkTrace"
    validations:
      required: true

  - type: input
    id: upstream
    attributes:
      label: Upstream project
      description: Canonical source repository or product website.
      placeholder: https://github.com/owner/project
    validations:
      required: true

  - type: input
    id: image
    attributes:
      label: Container image
      description: Prefer a public image with a stable version tag.
      placeholder: "ghcr.io/owner/project:1.2.3"
    validations:
      required: true

  - type: dropdown
    id: database
    attributes:
      label: Database or storage
      description: Select the primary persistence mode the first template should support.
      options:
        - No persistent storage
        - SQLite or local volume
        - PostgreSQL
        - MySQL or MariaDB
        - MongoDB
        - Redis or Valkey
        - Another external service
    validations:
      required: true

  - type: textarea
    id: compose
    attributes:
      label: Official Compose example
      description: Link the upstream Compose file or paste a minimal public example. Do not include real secrets.
      placeholder: https://github.com/owner/project/blob/main/docker-compose.yml
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Required configuration
      description: List required environment variables, ports, volumes, health checks, and any initialization or migration command.
      placeholder: |
        - HTTP port: 3000
        - Persistent volume: /app/data
        - Required secret: APP_SECRET
        - Health endpoint: /health
    validations:
      required: true

  - type: textarea
    id: swarm
    attributes:
      label: Swarm considerations
      description: Note privileged mode, host mounts, Docker socket access, direct published ports, custom networks, or single-node storage requirements.
      placeholder: Uses one local volume and should remain pinned to its storage node.
    validations:
      required: true

  - type: textarea
    id: variants
    attributes:
      label: Requested variants
      description: Optional variants such as SQLite and PostgreSQL, CPU and GPU, or bundled and external Redis.
      placeholder: One SQLite template and one PostgreSQL template.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Submission checks
      options:
        - label: I linked public documentation and did not include credentials or private data.
          required: true
        - label: I searched existing templates and open template requests for this product.
          required: true
